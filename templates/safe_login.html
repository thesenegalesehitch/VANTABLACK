<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VANTABLACK | RED TEAM OPS</title>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: #0a0a0a;
            color: #00ff00;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .scan-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background-color: rgba(0, 255, 0, 0.3);
            animation: scan 3s linear infinite;
            pointer-events: none;
        }
        @keyframes scan {
            0% { top: 0; }
            100% { top: 100%; }
        }
        .container {
            background-color: #000;
            padding: 40px;
            border: 1px solid #00ff00;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.2);
            text-align: center;
            width: 400px;
            position: relative;
        }
        .container::before {
            content: "SECURE CONNECTION ESTABLISHED";
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #0a0a0a;
            padding: 0 10px;
            font-size: 10px;
            color: #00ff00;
        }
        h1 {
            color: #00ff00;
            font-size: 28px;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 4px;
            text-shadow: 0 0 10px #00ff00;
        }
        .badge {
            background-color: #003300;
            color: #00ff00;
            padding: 4px 8px;
            font-size: 10px;
            border: 1px solid #00ff00;
            display: inline-block;
            margin-bottom: 20px;
        }
        p {
            font-size: 12px;
            color: #00cc00;
            margin-bottom: 20px;
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background-color: #000;
            border: 1px solid #005500;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            box-sizing: border-box;
        }
        input:focus {
            border-color: #00ff00;
            outline: none;
            box-shadow: 0 0 5px #00ff00;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #00ff00;
            color: #000;
            border: none;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            margin-top: 10px;
            font-family: 'Courier New', Courier, monospace;
            transition: all 0.3s;
        }
        button:hover {
            background-color: #00cc00;
            box-shadow: 0 0 15px #00ff00;
        }
        .footer {
            margin-top: 20px;
            font-size: 9px;
            color: #004400;
            text-align: left;
        }
        .blink {
            animation: blink 1s infinite;
        }
        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="scan-line"></div>
    <div class="container">
        <h1>VANTABLACK<span class="blink">_</span></h1>
        <div class="badge">SCENARIO: ACTIVE</div>
        <p>AUTHORIZED ACCESS ONLY</p>
        
        <form action="/login" method="POST">
            <input type="text" name="email" placeholder="IDENTITY_STRING" required autocomplete="off">
            <input type="password" name="password" placeholder="ACCESS_KEY" required autocomplete="off">
            <button type="submit">INITIATE SESSION</button>
        </form>

        <div class="footer">
            > SYSTEM: ONLINE<br>
            > ENCRYPTION: AES-256<br>
            > TRACE: DISABLED
        </div>
    </div>
</body>
</html>
