
user www-data;
worker_processes auto;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 1024;
}

http {
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format optimized for tracking
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log;

    # Basic Bot Blocking Map
    map $http_user_agent $is_bot {
        default 0;
        ~*(Googlebot|Bingbot|Yahoo|Baiduspider|YandexBot|AhrefsBot|MJ12bot) 1;
        ~*(curl|wget|python-requests|scrapy|http-client|java|perl) 1;
    }

    # Upstream Core Server (HIDDEN)
    upstream core_backend {
        server {{CORE_IP}}:8000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name {{DOMAIN}};

        # Redirect HTTP to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl http2;
        server_name {{DOMAIN}};

        ssl_certificate /etc/letsencrypt/live/{{DOMAIN}}/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/{{DOMAIN}}/privkey.pem;
        
        # SSL Hardening
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers "EECDH+AESGCM:EDH+AESGCM:AES256+EECDH:AES256+EDH";

        # Security Headers
        add_header X-Frame-Options SAMEORIGIN;
        add_header X-Content-Type-Options nosniff;
        add_header X-XSS-Protection "1; mode=block";

        location / {
            # Block Known Bots at Edge
            if ($is_bot) {
                return 404;
            }

            proxy_pass http://core_backend;
            
            # Forward Real IP
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $host;
            
            # Shared Secret for Core Authentication (prevents direct scanning)
            proxy_set_header X-Vantablack-Auth "Tier2-Verified-Secret-123";
            
            # Hide Upstream Details
            proxy_hide_header X-Powered-By;
            proxy_hide_header Server;

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
        
        # Block access to hidden files
        location ~ /\. {
            deny all;
        }
    }
}
