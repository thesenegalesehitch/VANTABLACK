<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vantablack C2 | Operations</title>
    <style>
        :root {
            --bg-color: #0a0a0a;
            --text-color: #00ff00;
            --accent-color: #ff0000;
            --panel-bg: #111;
            --border-color: #333;
        }
        
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px;
            overflow: hidden;
        }
        
        h1, h2, h3 {
            text-transform: uppercase;
            letter-spacing: 2px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }
        
        .container {
            display: grid;
            grid-template-columns: 1fr 3fr;
            grid-gap: 20px;
            height: 90vh;
        }
        
        .panel {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            padding: 20px;
            overflow-y: auto;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }
        
        .stat-card {
            background: #000;
            border: 1px solid var(--text-color);
            padding: 10px;
            text-align: center;
        }
        
        .stat-value {
            font-size: 2em;
            font-weight: bold;
        }
        
        .stat-label {
            font-size: 0.8em;
            opacity: 0.8;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        
        th, td {
            text-align: left;
            padding: 8px;
            border-bottom: 1px solid var(--border-color);
        }
        
        th {
            color: var(--accent-color);
        }
        
        .status-active {
            color: var(--text-color);
        }
        
        .status-captured {
            color: var(--accent-color);
            font-weight: bold;
            animation: blink 1s infinite;
        }
        
        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        
        .log-entry {
            font-size: 0.9em;
            margin-bottom: 5px;
            border-left: 2px solid var(--text-color);
            padding-left: 10px;
        }
        
        .log-time {
            color: #888;
        }
        
    </style>
</head>
<body>

    <h1>VANTABLACK <span style="color:var(--accent-color)">C2</span> // OPERATIONS</h1>
    
    <div class="container">
        <!-- Sidebar: Stats & Controls -->
        <div class="panel">
            <h2>System Status</h2>
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-value" id="active-sessions">0</div>
                    <div class="stat-label">Active Sessions</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="captured-creds">0</div>
                    <div class="stat-label">Creds Captured</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="uptime">0s</div>
                    <div class="stat-label">Uptime</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" style="color:red">OFF</div>
                    <div class="stat-label">Attack Mode</div>
                </div>
            </div>
            
            <h3>Activity Log</h3>
            <div id="activity-log" style="height: 300px; overflow-y: auto;">
                <div class="log-entry"><span class="log-time">[SYSTEM]</span> Dashboard initialized...</div>
            </div>
        </div>
        
        <!-- Main: Sessions Table -->
        <div class="panel">
            <h2>Live Sessions</h2>
            <table id="sessions-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>IP Address</th>
                        <th>User Agent</th>
                        <th>Status</th>
                        <th>Created</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Rows will be injected here -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = `${wsProtocol}//${window.location.host}/v5/dashboard/ws`;
        let socket;

        function connect() {
            socket = new WebSocket(wsUrl);
            
            socket.onopen = function() {
                log("Connected to C2 Server.");
            };
            
            socket.onmessage = function(event) {
                const data = JSON.parse(event.data);
                if (data.type === 'update') {
                    updateDashboard(data);
                }
            };
            
            socket.onclose = function() {
                log("Disconnected. Retrying...");
                setTimeout(connect, 2000);
            };
        }

        function updateDashboard(data) {
            // Update Stats
            document.getElementById('active-sessions').innerText = data.stats.active_sessions;
            document.getElementById('captured-creds').innerText = data.stats.captured_creds;
            document.getElementById('uptime').innerText = data.stats.uptime;
            
            // Update Sessions Table
            const tbody = document.querySelector('#sessions-table tbody');
            tbody.innerHTML = '';
            
            data.sessions.forEach(session => {
                const tr = document.createElement('tr');
                const statusClass = session.captured ? 'status-captured' : 'status-active';
                const statusText = session.captured ? 'CAPTURED' : session.status;
                
                tr.innerHTML = `
                    <td>${session.id.substring(0, 8)}...</td>
                    <td>${session.ip}</td>
                    <td title="${session.ua}">${session.ua.substring(0, 30)}...</td>
                    <td class="${statusClass}">${statusText}</td>
                    <td>${new Date(session.created_at * 1000).toLocaleTimeString()}</td>
                `;
                tbody.appendChild(tr);
            });
        }
        
        function log(msg) {
            const logDiv = document.getElementById('activity-log');
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.innerHTML = `<span class="log-time">[${new Date().toLocaleTimeString()}]</span> ${msg}`;
            logDiv.prepend(entry);
        }

        connect();
    </script>
</body>
</html>
