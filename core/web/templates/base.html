<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vantablack Core - Interface de Contrôle</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom CSS -->
    <link href="/static/css/main.css" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        vantablack: '#000000',
                        darkgray: '#1a1a1a',
                        accent: '#00ff88'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-vantablack text-white min-h-screen">
    <!-- Navigation -->
    <nav class="bg-darkgray border-b border-gray-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <div class="flex-shrink-0">
                        <h1 class="text-2xl font-bold text-accent">
                            <i class="fas fa-shield-alt mr-2"></i>
                            Vantablack Core
                        </h1>
                    </div>
                    <div class="hidden md:ml-6 md:flex md:space-x-8">
                        <a href="/ui" class="nav-link" data-page="dashboard">
                            <i class="fas fa-tachometer-alt mr-2"></i>Dashboard
                        </a>
                        <a href="/ui/guides" class="nav-link" data-page="guides">
                            <i class="fas fa-book mr-2"></i>Guides
                        </a>
                        <a href="/ui/status" class="nav-link" data-page="status">
                            <i class="fas fa-chart-bar mr-2"></i>Statut
                        </a>
                        <a href="/ui/qr" class="nav-link" data-page="qr">
                            <i class="fas fa-qrcode mr-2"></i>QR Tools
                        </a>
                        <a href="/ui/docs" class="nav-link" data-page="docs">
                            <i class="fas fa-file-alt mr-2"></i>Documentation
                        </a>
                    </div>
                </div>
                <div class="flex items-center">
                    <span class="bg-green-900 text-green-300 px-2 py-1 rounded text-sm">
                        <i class="fas fa-circle mr-1"></i>
                        <span id="status-indicator">Operational</span>
                    </span>
                </div>
            </div>
        </div>
    </nav>

    <!-- Mobile menu -->
    <div class="md:hidden bg-darkgray border-b border-gray-800" id="mobile-menu">
        <div class="px-2 pt-2 pb-3 space-y-1">
            <a href="/ui" class="nav-link mobile" data-page="dashboard">
                <i class="fas fa-tachometer-alt mr-2"></i>Dashboard
            </a>
            <a href="/ui/guides" class="nav-link mobile" data-page="guides">
                <i class="fas fa-book mr-2"></i>Guides
            </a>
            <a href="/ui/status" class="nav-link mobile" data-page="status">
                <i class="fas fa-chart-bar mr-2"></i>Statut
            </a>
            <a href="/ui/qr" class="nav-link mobile" data-page="qr">
                <i class="fas fa-qrcode mr-2"></i>QR Tools
            </a>
            <a href="/ui/docs" class="nav-link mobile" data-page="docs">
                <i class="fas fa-file-alt mr-2"></i>Documentation
            </a>
        </div>
    </div>

    <!-- Main content -->
    <main class="max-w-7xl mx-auto py-6 px-4 sm:px-6 lg:px-8">
        <div id="content" data-server-rendered="1">
            {% block content %}{% endblock %}
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-darkgray border-t border-gray-800 mt-12">
        <div class="max-w-7xl mx-auto py-6 px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center">
                <div class="text-sm text-gray-400">
                    <i class="fas fa-shield-alt mr-2"></i>
                    Vantablack Core v5.0 - Multi-OS Red Team Platform
                </div>
                <div class="text-sm text-gray-400">
                    <span id="sys-info">Loading system info...</span>
                </div>
            </div>
        </div>
    </footer>

    <!-- JavaScript -->
    <script src="/static/js/main.js"></script>
</body>
</html>
