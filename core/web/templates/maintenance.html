
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Maintenance</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f8f9fa;
            color: #343a40;
            display: flex;
            justify_content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            max-width: 600px;
            padding: 40px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 {
            color: #dc3545;
            font-size: 24px;
            margin-bottom: 20px;
        }
        p {
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .icon {
            font-size: 64px;
            margin-bottom: 20px;
            color: #ffc107;
        }
        .retry-btn {
            display: inline-block;
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            font-weight: 500;
            transition: background-color 0.2s;
        }
        .retry-btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">⚠️</div>
        <h1>Temporarily Unavailable</h1>
        <p>
            We are currently performing scheduled maintenance to improve our services.
            Please check back in a few minutes. We apologize for any inconvenience.
        </p>
        <p style="font-size: 14px; color: #6c757d;">
            Error Code: 503 Service Unavailable<br>
            Reference ID: <span id="ref-id"></span>
        </p>
        <a href="#" onclick="location.reload()" class="retry-btn">Retry Connection</a>
    </div>
    <script>
        document.getElementById('ref-id').textContent = Math.random().toString(36).substring(2, 15).toUpperCase();
    </script>
</body>
</html>
