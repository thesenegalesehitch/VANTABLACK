user www-data;
worker_processes auto;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # --- Stealth & Security Settings ---
    server_tokens off;
    more_clear_headers Server X-Powered-By X-Runtime; # Requires nginx-extras

    # Log format that mimics Apache or generic logs to confuse analyzers
    log_format stealth '$remote_addr - - [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent"';

    access_log /var/log/nginx/access.log stealth buffer=32k flush=5s;
    error_log /var/log/nginx/error.log warn;

    # Optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 10M;

    # SSL Settings (Modern & Stealthy)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # --- Tier 1 Filtering: Bot Detection ---
    map $http_user_agent $is_bot {
        default 0;
        ~*(Googlebot|Bingbot|Slurp|DuckDuckBot|Baiduspider|YandexBot|Sogou|Exabot|facebot|facebookexternalhit|ia_archiver|curl|wget|python-requests|libwww-perl|urllib|Scrapy|Nmap|Zgrab|Masscan|Go-http-client|censys|shodan|virustotal|PhishTank|Alibaba|Bytespider|SemrushBot|AhrefsBot|MJ12bot|DotBot|PetalBot|SeznamBot|Barkrowler|MegaIndex|ZoominfoBot|BlexBot|CensysInspect|InternetMeasurement|NetcraftSurveyAgent|Palo\ Alto\ Networks|Proofpoint|Barracuda|Mimecast|TrendMicro|Symantec|McAfee|Fortinet|FireEye|Zscaler|Kaspersky|Avast|Sophos|BitDefender|Eset|DrWeb|F-Secure|G-Data|Panda|Qihoo|Tencent|Yandex) 1;
        ~*(HeadlessChrome|PhantomJS|Selenium|Puppeteer|Playwright|Cypress|WebDriver) 1;
    }

    # Rate Limiting
    limit_req_zone $binary_remote_addr zone=one:10m rate=10r/s;

    # --- Upstream Configuration ---
    # The Core server (Tier 3). Ideally accessed via VPN (WireGuard) IP.
    upstream vantablack_core {
        server 127.0.0.1:8000; # PLACEHOLDER: Replace with Core IP via setup script
        keepalive 64;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name _;
        
        # Hide Nginx version
        server_tokens off;

        # Catch-all redirect to HTTPS
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name _; # PLACEHOLDER: Replace with Domain via setup script

        # SSL Certificates (Managed by Certbot)
        ssl_certificate /etc/ssl/certs/ssl-cert-snakeoil.pem;
        ssl_certificate_key /etc/ssl/private/ssl-cert-snakeoil.key;

        # SSL Optimization
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:50m;
        ssl_session_tickets off;
        ssl_stapling on;
        ssl_stapling_verify on;
        resolver 8.8.8.8 8.8.4.4 valid=300s;
        resolver_timeout 5s;

        # Security Headers
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options SAMEORIGIN;
        add_header X-XSS-Protection "1; mode=block";
        add_header Referrer-Policy "no-referrer-when-downgrade";

        # --- Main Proxy Logic ---
        location / {
            # 0. Rate Limiting
            limit_req zone=one burst=20 nodelay;

            # 1. Bot Filtering
            if ($is_bot) {
                # Return 404 or redirect to decoy
                # return 404; 
                return 302 https://www.wikipedia.org;
            }

            # 2. Proxy Pass to Core
            proxy_pass http://vantablack_core;
            
            # 3. Header Forwarding
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Pass the original host for multi-tenant handling in Core
            proxy_set_header X-Original-Host $host;

            # 4. Stealth: Hide backend identity
            proxy_hide_header Server;
            proxy_hide_header X-Powered-By;
            proxy_hide_header X-Runtime;

            # 5. Connection Handling
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            
            # Timeouts
            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # Static assets caching (optional)
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg)$ {
            if ($is_bot) { return 404; }
            
            proxy_pass http://vantablack_core;
            proxy_set_header Host $host;
            expires 1d;
            access_log off;
        }
    }
}
