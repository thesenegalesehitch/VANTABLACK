# Vantablack Tier 2 Redirector Configuration
# Ce fichier configure Nginx pour agir comme un proxy "muet" qui redirige le trafic valide
# vers le Core caché (Tier 3) tout en bloquant les scanners connus.

user www-data;
worker_processes auto;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logs minimalistes pour la performance (et la discretion)
    access_log /var/log/nginx/access.log combined buffer=32k flush=5s;
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # SSL Configuration (Géré par Certbot dans le script de setup)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # --- Bloquage Bot Basique (Tier 1 Filtering) ---
    map $http_user_agent $is_bot {
        default 0;
        ~*(Googlebot|Bingbot|Slurp|DuckDuckBot|Baiduspider|YandexBot|Sogou|Exabot|facebot|facebookexternalhit|ia_archiver|curl|wget|python-requests|libwww-perl|urllib|Scrapy|Nmap|Zgrab|Masscan|Go-http-client|censys|shodan|virustotal|PhishTank) 1;
    }

    # Upstream Core (Caché via VPN/Tunnel/IP privée)
    upstream vantablack_core {
        # Remplacer par l'IP/Domaine réel du Core (Tier 3)
        # Idéalement via un tunnel WireGuard ou SSH
        server 10.8.0.1:8000; 
        keepalive 32;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name _; # Catch-all pour le redirecteur

        # Redirection HTTP -> HTTPS
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name _; # Remplacer par le domaine du redirecteur

        # Certificats (Placeholder - remplacés par Certbot)
        ssl_certificate /etc/ssl/certs/ssl-cert-snakeoil.pem;
        ssl_certificate_key /etc/ssl/private/ssl-cert-snakeoil.key;

        # Headers de sécurité pour masquer l'identité du serveur
        server_tokens off;
        more_clear_headers Server; # Nécessite nginx-extras
        add_header X-Content-Type-Options nosniff;

        # --- Logique de Redirection ---

        location / {
            # 1. Filtrage Bot (Niveau Nginx)
            if ($is_bot) {
                return 404; # Ou rediriger vers un site légitime
            }

            # 2. Proxy Pass vers le Core
            proxy_pass http://vantablack_core;
            
            # Headers passés au Core
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Masquage des headers du Core
            proxy_hide_header Server;
            proxy_hide_header X-Powered-By;

            # Timeouts
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }

        # Location spécifique pour les assets statiques (Optionnel - pour alléger le Core)
        # location /static/ {
        #     root /var/www/html;
        # }
    }
}
