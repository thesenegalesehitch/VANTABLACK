user www-data;
worker_processes auto;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    # Logs
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Upstream to Uvicorn/Gunicorn
    upstream vantablack_app {
        server 127.0.0.1:8000;
    }

    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name c2.vantablack.local; # Replace with your C2 domain

        # SSL
        ssl_certificate /etc/ssl/certs/ssl-cert-snakeoil.pem;
        ssl_certificate_key /etc/ssl/private/ssl-cert-snakeoil.key;

        # Admin Panel & API
        location / {
            proxy_pass http://vantablack_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket Support (for Real-time Dashboard & AiTM)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
        
        # Static Files (if not served by FastAPI)
        location /static/ {
            alias /opt/vantablack/core/assets/;
            expires 30d;
        }

        # Security: Block direct access to critical endpoints if not from allowed IPs
        # (Optional: configure allow/deny here)
        # location /admin/ {
        #     allow 10.0.0.0/8; # VPN Range
        #     deny all;
        #     proxy_pass http://vantablack_app;
        # }
    }
}
