apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vantablack-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
  - hosts:
    - vantablack.your-domain.com
    secretName: vantablack-tls
  rules:
  - host: vantablack.your-domain.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: vantablack-api
            port:
              number: 8000
      - path: /ui
        pathType: Prefix
        backend:
          service:
            name: vantablack-api
            port:
              number: 8000
      - path: /v5
        pathType: Prefix
        backend:
          service:
            name: vantablack-api
            port:
              number: 8000