apiVersion: apps/v1
kind: Deployment
metadata:
  name: vantablack-redis
  labels:
    app: vantablack
    tier: cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vantablack
      tier: cache
  template:
    metadata:
      labels:
        app: vantablack
        tier: cache
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          exec:
            command: ["redis-cli", "ping"]
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command: ["redis-cli", "ping"]
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: vantablack-redis
spec:
  selector:
    app: vantablack
    tier: cache
  ports:
  - port: 6379
    targetPort: 6379
  type: ClusterIP