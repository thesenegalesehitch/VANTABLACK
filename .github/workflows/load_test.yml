name: Vantablack Load Test

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  load-test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install uvicorn[standard] aiohttp

    - name: Start Server
      run: |
        uvicorn core.web.server:create_app --factory --port 8000 &
        sleep 5

    - name: Run Load Test
      run: |
        python3 scripts/load_test.py --url http://localhost:8000/v5/health --n 10000 --c 100
